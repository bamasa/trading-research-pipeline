[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "trading-research-pipeline"
version = "0.1.0"
description = "Leakage-aware research pipeline for systematic trading: instruments, features, targets and models compared under one honest cost model."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
keywords = [
    "quantitative-finance",
    "market-microstructure",
    "limit-order-book",
    "machine-learning",
    "backtesting",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.26,<3",
    "pandas>=2.1,<3",
    "pyarrow>=15,<21",
    "pydantic>=2.6,<3",
    "pyyaml>=6,<7",
    "typer>=0.12,<1",
    "rich>=13,<15",
    "lightgbm>=4.7.0",
]

[project.optional-dependencies]
models = [
    "scikit-learn>=1.4,<2",
    "xgboost>=2.0,<4",
]
report = [
    "matplotlib>=3.8,<4",
    "jinja2>=3.1,<4",
]
deep = [
    "torch>=2.2,<3",
]
fast = [
    "orjson>=3.9,<4",
]
export = [
    "skl2onnx>=1.16,<2",
    "onnxruntime>=1.17,<2",
]
dev = [
    "pytest>=8,<9",
    "pytest-cov>=5,<7",
    "ruff>=0.6,<1",
    "mypy>=1.10,<2",
    "pandas-stubs>=2.1",
    "types-pyyaml>=6",
]

[project.scripts]
trading-research = "trading_research.cli:app"

[project.urls]
Homepage = "https://github.com/bamasa/trading-research-pipeline"
Issues = "https://github.com/bamasa/trading-research-pipeline/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/trading_research"]

# ---------------------------------------------------------------------------
# Tooling
# ---------------------------------------------------------------------------

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "."]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific
    "NPY",  # numpy legacy random / api
    "PD",   # pandas-vet
    "PTH",  # prefer pathlib
    "ARG",  # unused arguments
    "C4",   # comprehensions
    "RET",  # return simplifications
]
ignore = [
    "E501",  # line length is enforced by the formatter
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG001", "ARG002"]
# Experiment scripts are records of questions asked once, not library code.
# They print and write CSVs, and a top-level main() reading argv is the point.
"experiments/*" = ["T201"]

[tool.ruff.format]
docstring-code-format = true

[tool.mypy]
# Matches .python-version. The package supports 3.11+, but the bundled numpy
# stubs use 3.12 syntax, so analysing them as 3.11 fails before it starts.
python_version = "3.12"
files = ["src/trading_research"]
strict = false
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_untyped_defs = true
no_implicit_optional = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["xgboost.*", "sklearn.*", "matplotlib.*", "torch.*", "skl2onnx.*", "onnxruntime.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# The network classes subclass nn.Module, and nn arrives from an import that
# happens inside a function so that this module loads without torch installed.
# A base class from a lazily imported module is something mypy cannot resolve,
# and the per-line suppressions it accepts differ between versions.
module = ["trading_research.models.tcn"]
disable_error_code = ["misc", "name-defined", "unused-ignore"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
markers = [
    "slow: tests that take more than a couple of seconds",
    "network: tests that require network access (skipped by default in CI)",
]
filterwarnings = ["error::DeprecationWarning:trading_research.*"]

[tool.coverage.run]
source = ["src/trading_research"]
branch = true

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]
