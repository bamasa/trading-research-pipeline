# Market-making study: the machine-readable half of the pre-registration.
#
# docs/preregistration/market_making.md is the other half: it says what each
# value means and why it was chosen. The two were committed together on
# 2 October 2026, before any market-making code existed in this repository and
# before any market-making number was computed on any block. They must agree.
#
# Every value here is fixed now, except those set to null with the comment
# "frozen by the D amendment". Those are chosen on block D by the
# development-period search and written into this file by the single dated
# amendment, before block H is read. The amendment records the sha256 of this
# file as it stands after that write; the held-out ledger refuses to read H
# unless the file on disk matches that hash and is committed and clean. Nothing
# else in this file changes, except under the amendment protocol in the
# document.
#
# Units are in the key's suffix: _bp basis points, _ms milliseconds, _s seconds,
# _min minutes, _h hours, _usdt notional. Prices inside the simulator are
# integer ticks. Dates are UTC and inclusive. Seed ranges are inclusive.
#
# No code reads this file yet. The loader arrives with the development-period
# search; until then it is a record, not an input.

name: market_making_preregistration
registered: 2026-10-02
registered_against: "4367aca"  # main when this was written
document: docs/preregistration/market_making.md
venue: bybit
product: linear_perpetual
computed_before_registration: none  # no quote, fill, markout or profit on any block

blocks:
  D:
    role: development
    start: 2024-02-01
    end: 2024-02-25
    days: 25
    instruments: [BICOUSDT, CRVUSDT, XRPUSDT, BTCUSDT]
    sets: [admission, every searched parameter, theta, beta, guard settings,
           sigma of daily net, minimum detectable effect]
    reversion_state: present  # inside the search block of results.md section 27
  H:
    role: held_out
    start: 2024-02-26
    end: 2024-03-09
    days: 13
    instruments: [BICOUSDT, CRVUSDT, XRPUSDT, BTCUSDT]
    reads: 1
    read_after: the D amendment is committed
    ledger: experiments/results/mm_heldout_ledger.json
    reversion_state: present  # inside the held-out block of section 27
  buffer:
    role: excluded
    start: 2024-03-10
    end: 2024-03-11
    days: 2
    reason: CRV and XRP books end 2024-03-09; the reversion universe has no 2024-03-11
  F:
    role: boundary
    start: 2024-03-12
    end: 2024-04-07
    days: 27
    instruments: [BICOUSDT, BTCUSDT]
    reads: 1
    read_after: H's results are committed
    tests: [H2.1 boundary prediction, H2.2 boundary prediction,
            persistence of any H1 or H3 survivor]
    reversion_state: absent
    index_autocorrelation: -0.0003  # section 27, over 2024-03-12 to 2024-04-20
  P:
    role: pristine
    optional: true
    start: 2024-04-08
    end: 2024-05-05
    days: 28
    instruments: [BICOUSDT]
    fetch_required: true
    condition: a primary hypothesis is candidate after F
    hypotheses: [H1, H3]  # the reversion universe ends 2024-04-20
    reversion_state: not measured
  B:
    role: basket
    optional: true
    dates: [D, H]
    days: [25, 13]
    fetch_required: true
    condition: a second, separately committed pre-registration, before any fetch
    admission: the same rule as below
    source_table: experiments/results/screen_bybit_ranked.csv  # February window
    # February round trip less 12 bp of taker fees and slippage, at least 4 bp.
    candidates: [ALICEUSDT, ALGOUSDT, JTOUSDT, ZECUSDT, GALAUSDT, GMTUSDT,
                 CAKEUSDT, IOTAUSDT]

funding:
  source: bybit public REST, no credentials
  on_disk_at_registration: false
  fetched_for: every block before it is simulated

admission:
  computed_on: D
  committed_before: H
  statistics: [tick_bp, spread_bp_time_weighted, share_at_two_ticks_or_more,
               median_touch_over_median_print, prints_per_day,
               market_wide_passive_markout_bp_1s, market_wide_passive_markout_bp_5s,
               market_wide_passive_markout_bp_30s, coverage_D, coverage_H]
  mm_admitted:
    applies_to: [S0, S1, S2, S3, H1, H3]
    spread_bp_min: 4.0  # twice the base maker fee
    share_at_two_ticks_or_more_min: 0.25
    prints_per_day_min: 5000
    coverage_min: 0.90  # of D days and of H days, book and prints both present
    expected: [BICOUSDT]
  h2_admitted:
    applies_to: [H2.1, H2.2]
    universe: pipeline/discovery.UNIVERSE  # the 26 instruments of section 27
    exclude: ReversionConfig.exclude  # BTCUSDT, ETHUSDT
    coverage_min: 0.90  # of D days and of H days
    expected: [BICOUSDT, CRVUSDT, XRPUSDT]
  references:
    applies_to: [S0, ladder, fee_breakeven]
    instruments: [BICOUSDT, CRVUSDT, XRPUSDT, BTCUSDT]
    verdict: false
  if_unexpected: the committed D table wins
  table: [{symbol: BICOUSDT, tick_bp: 2.619, spread_bp: 6.08, share_two_ticks: 0.7917, touch_over_print: 12.9, prints_per_day: 14790, markout_1s_bp: -0.5251, markout_5s_bp: -0.9361, markout_30s_bp: -0.6483, coverage_D: 1.0, coverage_H: 1.0, mm_admitted: true, h2_admitted: true}, {symbol: CRVUSDT, tick_bp: 1.96, spread_bp: 2.13, share_two_ticks: 0.08189, touch_over_print: 10.72, prints_per_day: 72163, markout_1s_bp: -0.5948, markout_5s_bp: -0.7549, markout_30s_bp: -0.858, coverage_D: 1.0, coverage_H: 1.0, mm_admitted: false, h2_admitted: true}, {symbol: XRPUSDT, tick_bp: 1.884, spread_bp: 1.885, share_two_ticks: 0.0001818, touch_over_print: 2463.0, prints_per_day: 263038, markout_1s_bp: -0.983, markout_5s_bp: -0.9782, markout_30s_bp: -0.6664, coverage_D: 1.0, coverage_H: 1.0, mm_admitted: false, h2_admitted: true}, {symbol: BTCUSDT, tick_bp: 0.02087, spread_bp: 0.02141, share_two_ticks: 0.001968, touch_over_print: 474.8, prints_per_day: 1090765, markout_1s_bp: -0.4435, markout_5s_bp: -0.5319, markout_30s_bp: -0.4014, coverage_D: 1.0, coverage_H: 1.0, mm_admitted: false, h2_admitted: false}]  # frozen by the D amendment

fees:
  base:
    maker_bp: 2.0
    taker_bp: 5.5

simulator:
  order_latency_ms: 10
  cancel_latency_ms: 10
  feed_latency_ms: 0
  cancel_attribution: proportional
  arrival_growth: pro_rata_time
  queue_priority: tail
  crossed_policy: trade_tape
  fee_tier: base
  visible_levels: 10
  clip:
    rule: min(notional_usdt, touch_share x trailing one-hour median touch), rounded down to the lot
    notional_share_of_d_median_touch: 0.10
    touch_share: 0.10
    notional_usdt: {BICOUSDT: 20.0434, CRVUSDT: 55.8147, XRPUSDT: 3402.63, BTCUSDT: 25256.8}  # per instrument; frozen by the D amendment
  soft_limit_clips_s0: 6.0
  hard_limit: soft limit plus one clip
  flatten_slippage_bp: 0.5
  warmup_s: 600
  stop_quoting_at: "23:58"
  flatten_at: "23:59"
  suspend_after_snapshot_pause_s: 5
  funding_interval_h: 8  # read from the fetched history and asserted
  markout_horizons_s: [1, 5, 30]
  h2_markout_horizons_s: [60, 300, 600]
  decomposition_horizon_s: 5
  volatility:
    estimator: EWMA of 1 s mid returns, scaled to 1 min
    half_life_s: 60
    sigma_ref: {BICOUSDT: 7.92472, CRVUSDT: 8.04503, XRPUSDT: 4.70073, BTCUSDT: 3.42176}  # D median, per instrument; frozen by the D amendment
  skew_clamp: [0.25, 4.0]

strategies:
  S0:
    name: touch
    role: baseline and rung 0 of the ladder
    soft_limit_clips: 6.0
  S1:
    name: skew
    role: the market maker every hypothesis is compared against
    search:
      skew_bp: [2, 5, 10]
      k: [0, 0.5, 1, 2]
      min_edge_bp: [0, 1, 2, 4]
      soft_limit_clips: [3, 6, 12]
    cells: 144
    chosen:
      skew_bp: 2  # frozen by the D amendment
      k: 0.5  # frozen by the D amendment
      min_edge_bp: 4  # frozen by the D amendment
      soft_limit_clips: 6  # frozen by the D amendment
  S2:
    name: inside
    hypothesis: H1
    search:
      skew_bp: [2, 5, 10]
      k: [0, 0.5, 1, 2]
      min_edge_bp: [0, 1, 2, 4]
      soft_limit_clips: [3, 6, 12]
      m_ticks: [2, 3, 4]
    cells: 432
    twin: S2's chosen parameters with the inside rule off
    chosen:
      skew_bp: 2  # frozen by the D amendment
      k: 0.5  # frozen by the D amendment
      min_edge_bp: 4  # frozen by the D amendment
      soft_limit_clips: 6  # frozen by the D amendment
      m_ticks: 3  # frozen by the D amendment
  S3:
    name: guard
    hypothesis: H3
    guards: the better of S1 and S2 on D
    widen_factor: 2.0  # delta doubled
    search:
      action: [pull, widen]
      guard_window_min: [15, 60, 240]
    cells: 6
    chosen:
      guards: S1  # S1 or S2; frozen by the D amendment
      action: widen  # frozen by the D amendment
      guard_window_min: 15  # frozen by the D amendment
  S4:
    name: lean
    hypothesis: H2.1
    signal: index ten-minute return excluding the instrument, bp, right-labelled 5 s grid
    window_min: 10
    base: S1's chosen parameters, BICOUSDT's choice in bp for every instrument
    theta_rule: threshold_for_rate at the frozen 60 signals a day, on D
    beta_rule: OLS slope, no intercept, of the next 10-min return on s_t over D rows with |s_t| >= theta
    search:
      lambda: [0.5, 1, 2]
      one_sided: [false, true]
    cells: 6
    search_days: 25
    search_instruments: [BICOUSDT, CRVUSDT, XRPUSDT]
    theta_bp: {BICOUSDT: 98.3829, CRVUSDT: 97.7647, XRPUSDT: 99.7363}  # per H2-admitted instrument; frozen by the D amendment
    beta: {BICOUSDT: -0.254135, CRVUSDT: -0.146584, XRPUSDT: -0.134149}  # per H2-admitted instrument; frozen by the D amendment
    chosen:
      lambda: 1  # frozen by the D amendment
      one_sided: false  # frozen by the D amendment
  X1:
    name: passive reversion
    hypothesis: H2.2
    signal: the frozen ReversionConfig  # lookback, hold, cooldown 120 rows of 5 s; 60 a day
    entry: fading side at the touch, clip notional
    entry_timeout_min: 10
    exit: opposite touch; crossed as taker if still open 10 min after the fill
    exit_timeout_min: 10
    no_entries_in_last_min: 25
    search: none
    theta_bp: same as S4  # one theta per instrument, by the same rule on the same days
    taker_twin:
      rule: section 27 at the same trigger times
      thinning: {hold_rows: 120, cooldown_rows: 120}
      costs: {taker_fee_bp: 5.5, slippage_bp: 0.5}  # TakerCosts(5.5, 0.5)

d_search:
  method: validation.search.successive_halving
  runs: [S1, S2]
  instruments: mm_admitted
  budgets_days: [5, 12, 25]
  day_subsets: seeded and nested
  day_subset_seed: 0
  keep_fraction: 0.34  # the module default
  objective: mean daily net, USDT
  minimum_fills_per_day: 20
  choice: neighbourhood_scores  # median of the cell and its immediate neighbours
  choice_over: cells measured at the full budget
  peak_reported_beside: true
  neighbourhood:
    S1: {axes: [skew_bp, k, min_edge_bp, soft_limit_clips], chosen: [2, 0.5, 4, 6], median: -0.149666, own: 0.0976023, cells: [[2, 0.5, 4, 12, -0.0459298], [2, 1, 2, 12, -0.187232], [2, 0.5, 2, 12, -0.594127], [5, 1, 2, 12, -0.182673], [5, 0.5, 4, 12, 0.0469313], [2, 0.5, 4, 6, 0.0976023], [2, 1, 2, 6, -0.123747], [5, 1, 2, 6, -0.175585]], peak: [2, 0.5, 4, 6, 0.0976023], full_budget_cells: 16}  # chosen cell and its neighbours; frozen by the D amendment
    S2: {axes: [skew_bp, k, min_edge_bp, soft_limit_clips, m_ticks], chosen: [2, 0.5, 4, 6, 3], median: -0.123638, own: 0.0867689, cells: [[2, 0.5, 4, 12, 2, -0.0579701], [2, 0.5, 4, 12, 3, -0.0579701], [2, 0.5, 4, 12, 4, -0.0579701], [2, 1, 2, 12, 2, -0.18826], [2, 1, 2, 12, 3, -0.18826], [2, 1, 2, 12, 4, -0.18826], [2, 0.5, 2, 12, 2, -0.607402], [2, 0.5, 2, 12, 3, -0.60865], [2, 0.5, 2, 12, 4, -0.608568], [5, 1, 2, 12, 2, -0.180857], [5, 1, 2, 12, 3, -0.1831], [5, 1, 2, 12, 4, -0.183107], [5, 0.5, 4, 12, 2, 0.030401], [5, 0.5, 4, 12, 3, 0.0280153], [5, 0.5, 4, 12, 4, 0.0270928], [2, 0.5, 4, 6, 2, 0.0867689], [2, 0.5, 4, 6, 3, 0.0867689], [2, 0.5, 4, 6, 4, 0.0867689], [2, 1, 2, 6, 2, -0.123638], [2, 1, 2, 6, 3, -0.123638], [2, 1, 2, 6, 4, -0.123638], [5, 1, 2, 6, 2, -0.183089], [5, 1, 2, 6, 3, -0.184514], [5, 1, 2, 6, 4, -0.184473], [5, 1, 4, 12, 2, 0.016672]], peak: [2, 0.5, 4, 6, 2, 0.0867689], full_budget_cells: 49}  # chosen cell and its neighbours; frozen by the D amendment

metrics:
  primary: net_usd_day
  definitions:
    net_usd_day: spread + adverse + inventory - fees + funding, over a day that starts and ends flat
    net_bp_turnover: net / (maker turnover + taker turnover) x 1e4
    making_usd_day: spread + adverse(5 s) - fees
  decomposition:
    spread: side x (mid_ref - price) x size; mid_ref is the last snapshot mid at or before the fill
    adverse: side x (mid(t + 5 s) - mid_ref) x size
    inventory: gross trading - spread - adverse
  markouts:
    formula: side x (mid(t + h) - p_fill) / p_fill x 1e4
    weighting: volume
    split_by: fill path
    benchmark: every print in the tape, scored from the resting side
  reported: [fills_per_day, fill_ratio_per_order, time_quoted_per_side,
             rms_inventory, max_inventory, flattens, max_drawdown, clip_over_touch]
  significance:
    function: evaluation.significance.assess
    cluster: day
    series: symbol
    deciding_level: day
  minimum_detectable_effect:
    formula: 2 x sigma_D(daily net of the chosen strategy) / sqrt(13)
    sigma_d_usd_day: 1.60556  # frozen by the D amendment
    value_usd_day: 0.890603  # frozen by the D amendment

family:
  members: [H1, H2.1, H2.2, H3]
  test: day-level one-sided t
  correction: holm
  alpha: 0.05
  degrees_of_freedom: 12

statuses:
  killed: any of the hypothesis's kill conditions fires; needs no significance
  candidate: no kill condition fires and the day-level t passes Holm's procedure
  conditional: H2 only; candidate on H and the boundary prediction on F holds
  inconclusive: no kill condition fires and the significance bar is not met

common_kill_conditions:
  K-pess: a positive verdict under proportional cancellation attribution that is not positive under pessimistic attribution
  K-fund: net minus funding <= 0
  K-dir: making_usd_day <= 0 while net > 0

placebo_percentile: 95  # the true difference must exceed this percentile of the placebos

hypotheses:
  H1:
    title: inside the spread, first in the queue
    primary: true
    instruments: mm_admitted
    block: H
    fee_tier: base
    strategy: S2
    comparator: S2 twin  # the document's kill conditions call it S1
    statement: S2 earns a positive daily net, and more than its twin on the same days
    kill_conditions:
      K1: {test: sum of S2's daily net over H <= 0, outcome: killed}
      K2: {test: mean paired daily difference S2 - twin <= 0, outcome: killed}
      K3: {test: 5 s markout plus spread captured per inside fill is not greater than per touch fill of the twin, outcome: killed}
      K4: {test: the stale-trigger placebo gains at least as much over the twin as S2 does, outcome: killed}
    common_kill_conditions: [K-pess, K-fund, K-dir]
    placebos:
      stale_trigger:
        description: the inside decision reads the spread state of lag_s earlier; prices still post-only at arrival
        lag_s: 60

  H2.1:
    title: the reversion state, lean
    primary: true
    instruments: h2_admitted
    block: H
    strategy: S4
    comparator: S1
    metric: paired daily difference S4 - S1, pooled over instruments, clustered by day
    kill_conditions:
      K1: {test: mean paired difference <= 0, outcome: killed}
      K2: {test: the flipped placebo does at least as well, outcome: killed}
      K3: {test: the true difference does not exceed the 95th percentile of the shuffled-state placebos, outcome: killed}
    common_kill_conditions: [K-pess, K-fund, K-dir]
    placebos:
      flipped:
        description: lambda replaced by -lambda
      shuffled_state:
        description: the signal tape circularly shifted by whole days plus an intraday offset
        count: 50
        seed_first: 0
        seed_last: 49
        shift_whole_days: [1, 12]  # uniform integer
        shift_offset_h: [1, 23]  # uniform; never less than one hour
    boundary_prediction:
      block: F
      instrument: BICOUSDT
      prediction: mean paired difference <= 0
      if_holds: conditional
      if_fails: candidate, condition unconfirmed, and says so

  H2.2:
    title: the reversion state, passive execution of the frozen signal
    primary: true
    instruments: h2_admitted
    block: H
    strategy: X1
    comparator: taker twin
    metric: net per signal attempt, misses counted as zero, against the taker twin's net per trade on the same triggers
    kill_conditions:
      K1: {test: mean paired daily difference X1 - taker <= 0, outcome: killed}
      K2: {test: X1's net per attempt <= 0, outcome: killed}
      K3: {test: the flipped placebo does at least as well, outcome: killed}
      K4: {test: the true difference does not exceed the 95th percentile of the shuffled-state placebos, outcome: killed}
      K5: {test: fewer than min_fills fills in H, outcome: inconclusive, min_fills: 100}
    common_kill_conditions: [K-pess, K-fund, K-dir]
    placebos:
      flipped:
        description: post the side that follows the move
      shuffled_state: as in H2.1  # same count, seeds and shifts
    boundary_prediction:
      block: F
      instrument: BICOUSDT
      prediction: X1's net per attempt <= 0

  H2.3:
    title: causal state gate
    primary: false  # secondary, prior negative, outside the Holm family
    instruments: [BICOUSDT]
    blocks: [H, F]
    gate: trailing one-day index autocorrelation at or below D's median
    gate_threshold: -0.0541278  # D median; frozen by the D amendment
    statement: admitted days have a larger S4 - S1 difference than rejected days
    kill_conditions:
      K1: {test: admitted mean <= rejected mean, outcome: killed}

  H3:
    title: the regime guard
    primary: true
    instruments: mm_admitted
    block: H
    strategy: S3
    comparator: the strategy S3 guards
    statement: S3 earns more than the strategy it guards on the same days
    detectors:
      changepoint:
        function: validation.changepoint.detect
        input: instrument 1-second grid, mid and spread_bp, right-labelled
        run_from: 2024-02-01
        continuous: true
        window: 2000
        threshold: 20.0
        reference: 40
        minimum_gap: 20000
        statistics: [volatility, spread, intensity, autocorrelation]
        effective_at: label of row Break.index - 1, when the block that fired closed
      structural_breaks:
        function: validation.structural_breaks.detect_breaks
        input: one-minute log mid returns, right-labelled
        history_len: 250
        online_len: 60
        statistics: [scale, dependence]
        thresholds: {scale: 7.77, dependence: 7.65}  # RECORDED_THRESHOLDS[(250, 60)]
        effective_at: the close that produced the flag
      decision_latency_ms: 10
    kill_conditions:
      K1: {test: mean paired daily difference <= 0, outcome: killed}
      K2: {test: the true difference does not exceed the 95th percentile of the shifted-flag placebos, outcome: killed}
      K3: {test: flag rate on D outside flag_rate_per_day, outcome: untestable, flag_rate_per_day: [0.2, 24], declared: before H is read, retuning: none}
      K4: {test: fewer than min_flags flags in H, outcome: inconclusive, min_flags: 5}
    common_kill_conditions: [K-pess, K-fund, K-dir]
    placebos:
      shifted_flag:
        description: guard windows circularly shifted, count and spacing preserved
        count: 50
        seed_first: 0
        seed_last: 49
        offset_h: [6, block length - 6]  # uniform
    reported_beside: unguarded net per hour inside and outside the guard windows
    flag_rate_on_d_per_day: 8.88  # frozen by the D amendment

ladder:
  block: H
  instruments: [BICOUSDT, CRVUSDT, XRPUSDT, BTCUSDT]
  strategy: S0
  reported: [net_bp_turnover, fills_per_day]
  cumulative: true  # each rung adds to the previous
  oracle_rungs: [2, 3, 4, 5, 6]  # read the future, directly or through a rung below; upper bounds
  forecast:
    target: next 1 s mid change
    kind: oracle blend of the realised change with seeded noise
    noise_seed: 0
    quote_side_only_if_it_clears_the_fee: true
  rungs:
    - {rung: 0, change: baseline, queue_priority: tail, fee_tier: base, latency_ms: 10}
    - {rung: 1, change: front of the queue, queue_priority: front}
    - {rung: 2, change: forecast with R2 0.1, forecast_r2: 0.1}
    - {rung: 3, change: forecast with R2 0.3, forecast_r2: 0.3}
    - {rung: 4, change: latency 1 ms, latency_ms: 1}
    - {rung: 5, change: perfect foresight of the next 1 s, forecast_r2: 1.0}
    - {rung: 6, change: best published Bybit maker tier, fee_tier: best_published}

fee_breakeven:
  block: H
  per: [strategy, instrument]
  method: re-run gated strategies over the grid and interpolate the fee at zero net; analytic for S0
  maker_fee_grid_bp: [-1.5, -1.25, -1.0, -0.75, -0.5, -0.25, 0.0, 0.25, 0.5,
                      0.75, 1.0, 1.25, 1.5, 1.75, 2.0]
  compared_with: Bybit's published linear-perpetual tiers, transcribed into backtest/costs.py with source and retrieval date

robustness:
  block: H
  instruments: [BICOUSDT]
  strategies: all
  design: one axis at a time, the others at the simulator defaults
  axes:
    cancel_attribution: [pessimistic, proportional, optimistic]
    arrival_growth: [none, pro_rata_time, all_ahead]
    latency_ms: [1, 10, 50, 100, 250]
    feed_latency_ms: [0, 20, 50]
    crossed_policy: [trade_tape, assume_filled]
  enters_a_verdict: cancel_attribution pessimistic, through K-pess only

amendment:
  planned: 1
  when: after the D runs, before H is read
  records: [admission table, every searched parameter's chosen value with its neighbourhood,
            theta and beta per instrument, guard settings, flag rate on D,
            sigma of daily net, minimum detectable effect, sha256 of this file]
  date: 2026-10-03  # frozen by the D amendment
  config_sha256: recorded in the amendment, not in this file
