  spot_H_page: "experiments/results/spot_2026_page.md, read in full on 2026-10-27: taker results only (document, What was known, item 3)"
  spot_H_numbers_seen: {S25-PF: {status: killed, first_kill: "K1 at -17.35", net_bp_trade_regular: -17.35, gross_bp_trade_zero_fees: 2.65, gross_bp_turnover: 1.33, trades: 4427, placebo_percentile: 98.5, k_nbhd_median: -17.44, vip3: -9.35, vip9: -1.95, brackets: {optimistic: -17.26, pessimistic: -23.17, stale: -22.95, worse_of_two: -28.02}}, S25-PFT: {net_bp_trade_regular: -17.71, zero_fees: 2.29, trades: 5581}, thinned_calibration: {a_buy: -2.91, a_sell: -3.17, capacity_median: 0.0044}, bybit_rows: "S25-BB, S25-T, S25-PB and FILL-S as on the page"}
