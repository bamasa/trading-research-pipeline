blocks:
  reader_test: {days: [2026-03-03, 2026-03-04, 2026-03-05], use: "the readers' proof, stage 0's timing and the fill rule's checks; numbers discarded", read: freely}
  W: {start: 2026-04-01, end: 2026-04-30, days: 30, use: "the signal's warm-up only (2026-04-30 as D's first day's history); never scored", read: freely}
  D: {start: 2026-05-01, end: 2026-07-31, days: 92, use: "sigma_D and the minimum detectable effects; development summaries; the rehearsal on July; in-sample for the signal", read: freely}
  E: {start: 2026-08-01, end: 2026-08-07, days: 7, use: embargo, read: never}
  H: {start: 2026-08-08, end: 2026-10-21, days: 75, use: "the three slots' statuses and every measurement", read: "once, after the D amendment is committed, through the ledger"}
  P: {start: 2026-11-01, end: 2026-12-31, days: 61, use: "confirmation of a candidate on H", read: "once, only for a candidate, after H's results are committed, the fee amendment covers P's days and 2026-12-31 is published", deadline: "the later of 2027-01-31 and 30 days after the commit that first adds H's results (committer date, UTC)"}
  days_independent: "each day starts flat with no resting order; anything open at 23:59 is cancelled or flattened; no position is held across midnight"
  warm_cold: "the signal's features read the previous calendar day's prints when it is usable and in the same block, or W before D; any other day starts cold and its first 61 minutes are not scored (H's first day and P's start cold); the touch proxies carry across midnight on a warm day"

common:
  clip_btc: 0.010  # S25's clip; every order of every slot is one clip, or two for MK-SQ's signal side
  latency_ms: 10  # every post, requote and cancel takes effect 10 ms after its decision
  posting_hours: {first: "00:01", last: "23:58"}  # no entry, quote or requote decided outside; an exit may be decided and requoted until the flatten
  flatten_at: "23:59"  # every resting order cancelled, any position closed by a taker order
  touch_proxies: "spot/grid.py's: the ask proxy is the price of the last buyer-initiated print stamped at or before the instant, the bid proxy the last seller-initiated one's, the mid proxy their mean; every print counts; a side's proxy is undefined until that side prints, and carries across midnight from the previous usable day on a warm day"
  post_only: "a buy is posted at min(target, ask proxy - tick) and a sell at max(target, bid proxy + tick) when the other proxy is defined; a buy's price is rounded down to the tick, a sell's up"
  skew: "a position q in BTC (positive long) moves both quote prices to price x (1 - skew_bp_per_clip x 1e-4 x q / clip) before the post-only rule"
  short_side: "from held inventory, as the spot study: each day starts with one unit of BTC and quote worth three units at the day's first print, the unit being the slot's position limit; K-inv checked in both bookings (quote and received); the held unit's own P&L, marked from the day's first print to its last, is a separate line, never in a verdict"
  decisions_at: "print-grid row stamps (the signal) and clock instants (the requotes); every quantity in time is measured on stamps"

signal:
  row: S25-PF
  from: "the spot study's frozen files, in its checkout (ignored by git): models/spot_2026/slots/S25-PF.json and models/spot_2026/weights/S25-PF__hold_s=50__label_fee_bp=0.pkl"
  slot_file_sha256: d4048fa0902a5490c0b2238b52d7f0f4ed9c7bb558dc60345068598c8697a5d8  # configs/spot_2026.yaml artefacts.frozen_slot_files_sha256.S25-PF
  fit: S25-PF__hold_s=50__label_fee_bp=0.pkl
  fit_sha256: 4cf14dd130d361f9f8159da9ca272b5d99d6d30dfee7eacd9e0cb5c6d13ec9ba  # configs/spot_2026.yaml models.weights_sha256
  spot_config_sha256: d1625173c0b7a15c8785a957d77596210f46893e792c834449152e39cf5476b7  # the spot study's frozen configuration, which binds both
  cell: "hold_s=50|trades_per_day=240|label_fee_bp=0"
  theta: {theta_long: 0.46583154797554016, theta_short: 0.4700717031955719}  # configs/spot_2026.yaml models.thresholds.S25-PF, S25's cell
  copies: "models/spot_maker_2026/signal/S25-PF.json and models/spot_maker_2026/signal/S25-PF__hold_s=50__label_fee_bp=0.pkl (ignored by git), each sha256 checked at the copy and at every gate"
  inputs: "the nine print members (spot/features_prints.py, S25-PF's) on the print grid, the previous usable day's tail as history on a warm day"
  probabilities: "spot/days.predict: every row at or after the day's first scored stamp with every input present, the inputs through the store's float16 cast; any other row holds"
  decisions: "the hold-first rule with the frozen thresholds on every scored row: long, short or hold; a decision's instant is its row's stamp"
  hold_s: 50
  refitted: never

fills:
  order: "a resting limit order of side s (+1 buy, -1 sell), price p and size q, live from its decision + 10 ms until its cancel's decision + 10 ms (excluded)"
  primary: "trade_through: it fills on reachable prints of the other aggressor side (a buy on seller-initiated prints, a sell on buyer-initiated ones) stamped while it is live at a price strictly beyond p (below p for a buy, above for a sell), in archive order, each print filling min(remaining size, the print's size) at p: the queue at p is assumed exhausted, the pessimistic rule"
  touch: "the optimistic bracket: the same with prints at p or beyond"
  delayed: "K-fill's run: the trade-through rule with the first qualifying print after the order goes live filling nothing, so every fill comes one further print later"
  fill_time: "the print's stamp, also the fee's instant"
  fee: maker fee of the table at the fill's instant (0 at regular)
  cancel: an order's unfilled part at its cancel is cancelled and never fills
  rounding: a remainder of at most 1e-12 BTC is none
  flatten: "at 23:59 every resting order is cancelled and a position is closed by one taker order of its size, priced by the spot study's side-correct print rule (spot/fills.fill_orders with the position as its clip, arrival 23:59 + 10 ms, the day's end as its bound, its fallback when no print of its side follows), paying the table's taker fee at its instant (10 bp at regular); counted"
  rule_variants: [trade_through, touch, delayed]

slots:
  MK-S:
    question: "does S25-PF's signal pay as a maker at the fees charged"
    signal: S25-PF
    entry: "at a decision row t of side s, flat and with no resting order, inside the posting hours: one clip on side s at its own proxy at t (a buy at the bid proxy, a sell at the ask proxy), post-only; cancelled, its unfilled part, at the earliest of t + hold, the first later decision of the other side and 23:59; not posted when its own proxy is undefined (counted)"
    exit: "decided at the earliest of the first print-grid row stamped at or after the entry's first fill + hold, the first decision of the other side after t, and 23:59; a resting order of the other side for the position, at its own proxy shifted by the skew, post-only, sized at its arrival; requoted every requote_s after its decision at the proxy then; a remainder at 23:59 is flattened as a taker (counted)"
    one_position: "a decision is taken only at a row stamped at or after the previous entry's cancel decision when nothing filled, or the position's last fill when it did; the others are skipped and counted"
    hold_s: 50
    requote_s: 60
    skew_bp_per_clip: 0
    limit_clips: 1
    neighbourhood: {requote_s: [30, 60, 120], skew_bp_per_clip: [-1, 0, 1]}
  MK-Q:
    question: "does plain two-sided quoting at the touch proxies pay; the control without a signal"
    signal: none
    quotes: "at every requote instant, the multiples of requote_s from midnight from 00:01 to 23:58: both orders cancelled and reposted, a buy at the bid proxy and a sell at the ask proxy, one clip each, shifted by the skew, post-only; the buy's size cut to limit - position and the sell's to limit + position, at their arrival; a side whose own proxy is undefined is not quoted; the orders rest until the next instant's cancel or 23:59"
    requote_s: 60
    skew_bp_per_clip: 1
    limit_clips: 1
    neighbourhood: {requote_s: [30, 60, 120], skew_bp_per_clip: [0, 1, 2]}
  MK-SQ:
    question: "does two-sided quoting with the signal's side doubled pay"
    signal: S25-PF
    quotes: "as MK-Q, with requote instants also at every S25-PF decision row inside the posting hours and at each such decision + hold (inside the posting hours); at an instant the signal's side is that of the latest such decision stamped at or before it and less than hold before it, or none; the signal side's order is two clips, the other side's one clip"
    hold_s: 50
    requote_s: 60
    skew_bp_per_clip: 1
    limit_clips: 2
    neighbourhood: {requote_s: [30, 60, 120], skew_bp_per_clip: [0, 1, 2]}
  verdict: "net_bp_fill at the regular tier (maker 0, taker 10 bp)"

metrics:
  primary: {MK-S: net_bp_fill, MK-Q: net_bp_fill, MK-SQ: net_bp_fill}
  net_bp_fill: "the day's net in quote over every fill, maker and taker, fees included (the day ends flat), over the day's turnover, the sum of its fill notionals, x 1e4; the daily series has one value per day with at least one fill"
  net_bp_clip_day: "the day's net in quote over the notional of one clip at the day's first print x 1e4: the net per day; a day without a fill counts 0"
  gross_bp_fill: "the same before fees, labelled conditional on a zero-fee venue"
  making_part: "the mean, over every maker fill of the block, of its 5 s markout side x (mid proxy at the fill's stamp + 5 s - the fill price) / the fill price x 1e4, in bp per fill; a fill without a defined mid proxy then has none"
  markouts_s: [1, 5, 30]
  spread_part: "side x (the mid proxy just before the fill's print - the fill price) / the fill price x 1e4; the adverse part is the 5 s markout less it"
  daily_series_decides: "mean, day-level t, Newey-West t (lag 5), median day, K1, K-days, every run's block mean: on the daily series, one row per day, through evaluation/significance and market_making/verdicts.day_t and holm"
  run_mean: "a run's block mean is the mean of its daily net_bp_fill over the block's days with a fill of that run; a run without a fill on the block scores 0"
  mde:
    formula: "(3 + 0.84) x sigma_D / sqrt(n_eff); sigma_D the standard deviation (ddof 1) of the slot's daily series over D's days with a fill; n_eff = 75 x the share of D's usable days with a fill; on P, x sqrt(75 / P's usable days)"
    sigma_d: {MK-Q: 0.38084320732512567, MK-S: 1.23671549657292, MK-SQ: 0.3586095663387228}  # {slot: sigma} over D; frozen by the D amendment
    value: {MK-Q: 0.16886778490997892, MK-S: 0.5483658430904501, MK-SQ: 0.15900927717860086}  # {slot: mde}; frozen by the D amendment

family: [MK-S, MK-Q, MK-SQ]
statuses:
  m: 3
  bar: {holm_alpha: 0.05, one_sided: true, day_t_min: 3.0, newey_west_t_min: 2.0, newey_west_lag: 5, median_day_positive: true, min_days_with_fill: {H: 20, P: 10}}
  precedence: ["void (K-units, K-acct, K-inv, K-pos; counted as killed)", "inconclusive (too few fills) (K-trades)", "killed (any kill)", "candidate on H, passes on P (the bar met)", "inconclusive, below the minimum detectable effect when |mean| < MDE, else inconclusive"]
  holm_p_one: "a slot void, killed, inconclusive with too few fills, not assessed or not taken to the block enters Holm with p = 1"
  P_table: {candidate_passes: confirmed, candidate_fails_no_kill: "candidate, not confirmed", candidate_killed: killed on P, candidate_void: void, candidate_P_unreadable: "candidate, not confirmed (P unreadable)", candidate_P_failed: "candidate, not confirmed (P read failed)", candidate_P_not_read: "candidate, not confirmed (P not read by its deadline)", other: that status}
  unreadable: "a block with more than a quarter of its days excluded is unreadable: every slot not assessed (H unreadable on Binance); a read that fails twice at the same stage with the same exception, or not finished after five resumptions, closes: not assessed (H read failed)"
  defect_after_read: "void (defect found after the <block> read): only lowers a status"

kill_conditions:
  per_slot:
    MK-S: [K1, K-dir, K-placebo, K-drift, K-nbhd, K-days, K-latency, K-fill, K-cap]  # the first kill is the first that fires in this order
    MK-Q: [K1, K-dir, K-drift, K-nbhd, K-days, K-latency, K-fill, K-cap]  # no signal, so no K-placebo
    MK-SQ: [K1, K-dir, K-placebo, K-drift, K-nbhd, K-days, K-latency, K-fill, K-cap]
  void: [K-units, K-acct, K-inv, K-pos]
  K1: "the mean of the slot's daily net_bp_fill on the block is <= 0 at the registered fees"
  K-dir: "the making part, the mean 5 s markout over the block's maker fills, is <= 0 (bp per fill)"
  K-placebo: "the true mean does not exceed both the 95th percentile of the 200 random-direction runs' means and the sign-flipped signal's run mean"
  K-drift: "the true mean does not exceed the larger of the all-long and the all-short runs' means; for MK-S and MK-SQ every signal direction replaced by long (short); for MK-Q, quoting the buy side only (the sell side only)"
  K-nbhd: "the median, over the slot's nine neighbourhood cells (requote x skew, its own cell included), of each cell's block mean is <= 0; a cell without a fill scores 0"
  K-days: "half or fewer of the series' days are positive"
  K-latency: "a positive result whose run with every post, requote and cancel taking effect 110 ms after its decision has a block mean <= 0"
