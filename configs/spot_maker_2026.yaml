  signal_on_H: "the decision to run this study followed the spot H page, which shows S25-PF's gross edge at zero fees positive on H at taker fills; MK-S and MK-SQ are therefore not blind to the sign of their signal's gross edge on H's days"
  successor_rule: "the spot registration spends H and P for its slots and sends a successor of its slots to days after 2026-12-31; by the owner's decision of 2026-10-27 this study's maker slots are new slots, not successors or corrections of the spot study's, and read H once under their own ledger"
  consequence: "H can make a slot no more than a candidate; P (2026-11-01..12-31, after this registration) is the only confirmatory block"

expected_outcome:
  arithmetic: "S25-PF on H paid +2.65 bp a round trip before fees at taker fills (+1.33 bp of turnover per side); a maker pays 0 on both legs, but its buy at the bid fills only when sellers trade through it, mostly on decisions the price moved against; the touch of BTC/FDUSD is likely one tick (0.01 FDUSD, about 0.001 bp), so no spread is earned; an exit still resting at 23:59 pays 10 bp as a taker"
  predictions: {MK-S: "killed by K1 on H, net between -1 and 0 bp per fill (-2 to 0 bp per round trip), inside the owner's range of -2 to +2 bp per round trip", MK-Q: "killed by K1 on H, its making part negative (K-dir also fires)", MK-SQ: "killed by K1 on H, between MK-Q and MK-S"}
  not_predicted: [the fill rates, the sign of the touch bracket's result, the size of the making part]

