d_procedure:
  stage_0: "the reader-test days: copied, loaded through the loader, the print contract and tick checked; the signal computed and every slot run once per day; the fill rule's checks (trade-through fills within touch fills, delayed within trade-through, fills inside each order's life and size, the account's identity); timings; every number discarded but the checks and timings"
  code_freeze: "docs/spot_maker_2026_code_freeze.md names the commit on a line Code-freeze commit: `<sha>`; stage 1, D and the amendment start only if the study code is unchanged since it"
  stage_1: "W and D copied; the signal computed on D's days (W's last day as D's first day's history)"
  D: "every run of every slot on D's 92 days; sigma_D and the MDEs; development summaries; the rehearsal: H's status rules applied to July with the values about to be frozen, labelled rehearsal; the fill rule's calibration (calibration); nothing is chosen, nothing is searched"
  in_sample: "D is in-sample for the signal: its frozen fit was trained on D's first 85 days and its thresholds set on the last 7; D's numbers describe, they never decide"
  run_log: "every computation on a D day appends a row (date, run, stage, days) to data/spot_maker_2026/run_log.json, never committed; its sha256 and row count are frozen in compute.record.trials and checked at H's and P's gates"

copy_budget:
  sizes_mb: {reader_test: 8.04, W: 35.09, D: 76.31, H: 51.33}  # the spot study's converted files, listed 2026-10-27
  network: none
  disk_margin_gb: 10  # each stage starts only if free disk exceeds 1 GB by this margin
  stage_budget_gb: 1

compute:
  estimate: "features about 1 s a day; MK-S and MK-Q under 3 s a day for every run; MK-SQ about 30 s a day with its 200 random draws; D and H each under an hour on four worker processes"
  workers: runtime argument, days in parallel, at most four
  record: {stage_0: {timings_s: {checks_s_a_day: 1.8425167500196646, copy_s: 0.020473833894357085, days: {'2026-03-03': {checks_s: 1.752104250015691, features_s: 1.0021733748726547, load_s: 0.23686108319088817, runs_s: 20.632431000005454, signal_s: 0.055190542014315724}, '2026-03-04': {checks_s: 2.1209886660799384, features_s: 1.170941666001454, load_s: 0.031091291923075914, runs_s: 25.65875266585499, signal_s: 0.053286584094166756}, '2026-03-05': {checks_s: 1.6544573339633644, features_s: 0.8085642498917878, load_s: 0.0222116659861058, runs_s: 19.219830624992028, signal_s: 0.03756237495690584}}, features_s_a_day: 0.9938930969219655, load_s_a_day: 0.09672134703335662, runs_s_a_day: 21.83700476361749, signal_s_a_day: 0.04867983368846277}, passes: true}, disk: [{free_gb: 27.130454016, needed_gb: 11.0, passed: true, stage: '0'}, {free_gb: 28.646039552, needed_gb: 11.0, passed: true, stage: '1'}, {free_gb: 28.551016448, needed_gb: 11.0, passed: true, stage: D}], copies: {sha256: 69d1e3deba64be0fb486a24cfc62ba1f970f3238648960fe3aa373e8b23c015d, absent: [], bytes: 111393463, days: 122}, code_freeze: {commit: bf044ea3c2eb76710b33fe6e9528cb4faac2eccc}, trials: {sha256: 2f8ef9d2d4d1225910d691bcf68d1841ccccf7b16dcc551175b21c609fdf9523, rows: 3}, d_run: D1}  # stage 0's timings and checks, free disk at each stage, the copy log's sha256 and counts, the code-freeze commit at code_freeze.commit, the run log's {sha256, rows} at trials; frozen by the D amendment

access:
  development: "the reader-test days, W and D; nothing else of any year; the reader-test days alone also for one of the purposes readers' proof, stage 0 timing and dry run, stamped reader test (<purpose>)"
  never: ["E", "any day of 2025", "the 2025 study's reader-test days 2026-01-05..07"]
  ledger: experiments/results/spot_maker_2026_ledger.json
  H_opens_if: ["the amendment records the configuration's sha256, the file on disk has it and is committed", "the study code is the code the amendment froze: the code-freeze commit compute.record names, HEAD descending from it, nothing of src/, experiments/spot_maker_2026.py, pyproject.toml or uv.lock changed since", "the configuration changed since that commit only in its placeholders and the document only by appending one Frozen configuration sha256 line and no Null-placeholder sha256 line", "the tree clean but for the ledger", "the signal's copies at the registered sha256s", "the run log at its frozen sha256 and row count", "no file of H on disk: no path under data/spot/ names a day of H or a month holding one"]
  open_entry: "block, the session's commit, the configuration's sha256, the environment fingerprint and the UTC time, committed before the block is copied; every later process checks it in HEAD's ledger, the tree and git diff since the session's commit list nothing but the ledger, and the fingerprint equals the open entry's"
  session: "a read is bound to (block, commit, configuration sha256, fingerprint); its first process copies the block and records the copies; they are committed; its second computes, writes experiments/results/spot_maker_2026_<block>.json and the page, and closes with the results file's sha256"
  P_opens_if: ["a slot is a candidate on H", "by P's deadline", "H's results file committed unchanged", "since H's read only README.md, experiments/results/ and docs/ outside docs/preregistration/ changed, but for the fee amendment's intervals", "2026-12-31 published on Binance's archive"]
  second_read: "raises unless forced; stamped second read; changes no status"
  spent: "H and P are spent for these slots"

amendment:
  placeholder_comment: frozen by the D amendment
  D_amendment: "after D and before H: one dated entry under the document's Amendments, written by the entry point and reviewed before it is committed, recording every placeholder's value and the configuration's sha256 after they are written, on a line Frozen configuration sha256: `<hash>`"
  corrections_before_H: "a bug fixed only by a further dated amendment that states it and re-runs D in full if it could change a D number; no amendment may cite a D number or anything seen on spot data as its reason, except a fault it names; a change outside the placeholders records a new null-placeholder hash on a line Null-placeholder sha256: `<hash>` before the code freeze"
  fee_amendment: "the only amendment after H: P's intervals, one line each, from 2026-10-22, by P's deadline, before P opens"
  after_H: "nothing changes and nothing is re-run under another rule; a defect only lowers a status, stated in docs/spot_maker_2026_defects.md"
  date: '2026-10-27'  # the D amendment's date; frozen by the D amendment

artefacts:
  results: experiments/results/spot_maker_2026_<block>.json
  page: experiments/results/spot_maker_2026_page.md
  trials_manifest: experiments/results/spot_maker_2026_trials.json
  code_freeze_note: docs/spot_maker_2026_code_freeze.md
  work: "artifacts/spot_maker_2026/ and data/spot_maker_2026/ (never committed)"
  headlines:
    each_slot: "[slot] on H, Binance spot BTC/FDUSD at the fees charged: [status]; first kill [K-x] at [value] against [reference]."
    MK-S: "S25-PF's signal as a maker on Binance BTC/FDUSD, August to October 2026: [net] bp per fill at a 0 bp maker fee, [fills] fills a day, making part [making] bp per fill; [status]."
    MK-Q: "Two-sided quoting at the touch proxies on Binance BTC/FDUSD, August to October 2026: [net] bp per fill, making part [making] bp per fill; [status]."
    MK-SQ: "Quoting with S25-PF's side doubled on Binance BTC/FDUSD, August to October 2026: [net] bp per fill, making part [making] bp per fill; [status]."
    fill_rule: "Under the touch rule MK-S's net was [touch] bp per fill against [net] under trade-through."
    P: "[slot] on P: [status]."
  sentence_rules: "values with two decimals and their unit (K-days: share of days positive; K-cap: share of printed volume; every other: bp, per fill where the quantity is per fill); a slot with no kill reads none at n/a against n/a; [fills] has one decimal"
