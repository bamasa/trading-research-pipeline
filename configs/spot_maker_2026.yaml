# Maker versions of S25-PF on Binance BTC/FDUSD at the fees charged, on 2026
# data: the machine-readable half of the pre-registration.
#
# docs/preregistration/spot_maker_2026.md is the other half: it says what each
# value means and why it was chosen. The two were committed together on 27
# October 2026, on the local branch spot-maker/prereg cut from spot/prereg at
# 8270e6a, before this study copied, opened or computed on any print. They must
# agree.
#
# Every value here is fixed now, except those set to null with the comment
# "frozen by the D amendment". Those are set on block D and written into this
# file by the single dated amendment, before block H is read. The amendment
# records the sha256 of this file after that write; the study's ledger refuses
# to open a held-out block unless the file on disk has it and is committed and
# clean. Nothing else here changes, except under the document's amendment
# protocol.
#
# Conventions of the spot study hold: units in the key's suffix (_bp, _ms, _s,
# _btc, _mb), UTC dates inclusive, seed ranges inclusive. The instrument is
# keyed by venue and market, never by symbol alone.
#
# The study's code reads this file: spot_maker/registration.py validates it
# against the code's constants and its registered sha256, and the fee table is
# read from the fees block when the code runs.

name: spot_maker_2026_preregistration
registered: 2026-10-27
registered_against: "8270e6a"  # spot/prereg after the spot study's H results were committed
document: docs/preregistration/spot_maker_2026.md
registers: maker versions of S25-PF on Binance spot BTC/FDUSD at the fees a Regular account is charged; three slots under Holm with m = 3
searched: false  # no value chosen on an outcome; the signal is frozen, the quoting coordinates are fixed here
instrument: {id: "binance-spot:BTCFDUSD", key: binance_spot_BTCFDUSD, venue: binance, market: spot, symbol: BTCFDUSD, quote: FDUSD, plane: prints, tick: 0.01, lot: 1.0e-05, steps_from: "the spot study's D amendment, configs/spot_2026.yaml data.instrument_spec"}
