measured_rows:  # no status, no place in Holm, no precedence; kills reported: [K1, K-label, K-placebo, K-drift, K-days, K-fee, K-latency, K-fill]; K-nbhd not computed (own cell only)
  S25-PB: {instrument: bybit_spot_BTCUSDT, recipe: S25-PF's, on: "Bybit's spot prints", fits: its own cell only (3), priced_by: [common.print_fill, common.book_fill], blocks: [D, H, P]}
  S25-PFT: {instrument: binance_spot_BTCFDUSD, recipe: S25-PF's, inputs: "features.print_members + features.touch_proxy_members", fits: its own cell only (3), blocks: [D, H, P]}
  per_slot: [long-only variant, gross at zero fees, every tier of the fee table, the inventory's own P&L]

labels:
  print:
    slots: [S25-PF, S25-PB, S25-PFT]
    entry: the print rule at t + 10 ms
    exit: "the label's exit order decided at the first row stamped at or after the entry fill's print + hold, filled by the print rule"
    normalised_by: the mid proxy at the entry fill
    long_bp: (exit sell price - entry buy price) / mid proxy x 1e4 - 2 x label fee
    short_bp: symmetric
    classes: "long if long_bp > 0, short if short_bp > 0, the larger when both are, hold on a tie or otherwise"
    no_label: a row without an entry or exit fill before its day ends; not a training row
    both_sides: a row has a label only when its long and its short round trip are both complete
    mid_proxy_at_fill: "from the day's prints at the fill's stamp; undefined (a side not yet printed): no label"
    reads_until_ns: the stamp of the last print a row's label reads, kept with every label row (models.purge)
    label_fee_bp: [0, 10]  # 0 for the slot; the neighbourhood's two values
    horizon: hold  # the label declares h; the purge is derived from it
  walked_taker: {slots: [S25-BB], definition: the 2025 registration's walked-book label, unchanged, label_fee_bp: [0, 10], depth: common.book_levels.walk}  # the 2025 class rule

features:
  s25_selected: [queue_imbalance, depth_imbalance, log_depth_ratio, concentration_imbalance, impact_imbalance_bp, microprice_dev_bp, ofi_20, slope_imbalance, ofi_20_norm, imbalance_slope_10, ask_impact_bp, ask_concentration, bid_concentration, bid_impact_bp, ask_slope_bp, ofi_1, bid_slope_bp, ask0_log_change_bp_1s, micro_drift_5, mid_return_20_bp, flow_persistence_24, flow_imbalance_24, flow_imbalance_6, mid_return_1_bp, vwap_deviation_bp, trade_run_length_60s, ask0_log_change_bp_5s, size_shock_10, flow_imbalance_120, realized_vol_50_bp, turn_count_10s, realised_vol_20, turn_count_5s, trade_intensity_120, trade_intensity_6, trade_intensity_24, volatility_1s_bp, spread_bp, turn_count_2s, quote_intensity_20]  # configs/short_horizon_2025.yaml features.selected; not selected again
  print_members: [flow_imbalance_6, flow_imbalance_24, flow_imbalance_120, trade_intensity_6, trade_intensity_24, trade_intensity_120, flow_persistence_24, vwap_deviation_bp, trade_run_length_60s]
  touch_proxy_members: [spread_bp, quote_intensity_20, mid_return_1_bp, mid_return_20_bp, realized_vol_50_bp, realised_vol_20, volatility_1s_bp, turn_count_2s, turn_count_5s, turn_count_10s, ask0_log_change_bp_1s, ask0_log_change_bp_5s]  # S25-PFT only
  touch_proxies: {ask: the last buyer-initiated print's price, bid: the last seller-initiated print's price, mid: their mean, from: "every print, rpi included, the state right after each row's prints", undefined: until the side has printed, midnight: carried from the previous usable day}
  touch_proxy_code: "the 2025 functions with the ask and bid proxies as level-0 prices and sizes undefined, each with its own lookback and 3,600 s of winsorising, declared on the trades plane of the print registry"
  vwap_deviation_undefined: without a previous row or without a mid proxy there
  warm_history: "after a usable day, the print members read that day's last prints, as many as the longest window needs in rows as well as in time (120 rows can span more than 62 minutes on a thin day); the book slots carry 62 minutes"
  dropped_on_prints: 19  # the size and depth members; no analogue on prints
  print_windows: the 6, 24 and 120 rows of the flow builder count rows of the print grid  # a registered change of meaning
  vwap_deviation_on_prints: "a row's volume-weighted print price over the previous row's mid proxy: two registered changes of meaning, the mid proxy for the book's mid and row t-1 for row t"
  winsorising: {quantiles: [0.001, 0.999], window_s: 3600, on: each feature's own trailing values on row stamps}  # as in 2025
  raw_size_columns: {S25-BB: [ofi_1, ofi_20], S25-T: [ofi_1, ofi_20], print_members: none}
  touch_size_S25-BB: "median of bid_size_0 and ask_size_0 pooled over every W row of Bybit's spot book"  # data/feature_store.median_touch_size
  touch_size_S25-T: the 2025 study's fitted-values file's touch size, unchanged
  registry: the print members in a registry of their own, never the global features.REGISTRY
  leakage_check: "validation/leakage_timed.check_timed_causal (prints cut at a time strictly inside a row interval) and check_streaming_parity on every print member and touch proxy before any D run; validation/leakage.py only for features on the row registry (K-leak)"
  longest_lookback_minutes: 61
  stores: {dtype: float16, rows: every tenth row, format: one zstd parquet per day, every_row: computed per day for predictions, never stored}
  fitted_values: the touch size of S25-BB and any other fitted constant, in one file
  fitted_values_sha256: null  # the sha256 of that file; checked by the H and P gates; frozen by the D amendment

models:
  gbm: {code: models/gbm.py, classes: 3, settings: repository defaults, seed: 42, cores: all, fits_at_once: 1}
  training_rows: {targets_every_nth_row: 10, max_rows_per_fit: 4000000, sampling: evenly in time, as in 2025}
  thresholds_rule: "the 2025 hold-first rule: per side, the n-th largest probability over the inner validation's every row, n = round(rate / 2 x days), half to even, at least one"
  purge: hold plus 61 minutes before each inner validation and each test month
  purge_on_prints: "also a print label row dropped from training when its reads_until_ns lies after the inner validation's first stamp, and from the inner validation when it lies after the fold's cutoff (its test month's first stamp; 2026-08-01 for the frozen fits); the hold plus 61 minutes stays as a minimum"
  frozen_files: {root: models/spot_2026, weights: "weights/<fit key>", slots: "slots/<slot>.json", fitted_values: fitted_values.json}  # ignored by git
  fits:
    june: {train: [2026-05-01, 2026-05-24], theta: [2026-05-25, 2026-05-31], scored: 2026-06}
    july: {train: [2026-05-01, 2026-06-23], theta: [2026-06-24, 2026-06-30], scored: 2026-07}
    frozen: {train: [2026-05-01, 2026-07-24], theta: [2026-07-25, 2026-07-31], scored: [H, P]}
  fits_per_slot: {S25-PF: 18, S25-BB: 18, S25-PB: 3, S25-PFT: 3, S25-T: 0}  # every hold and label fee of the neighbourhood on every fold for the slots; 42 in all
  fold_leakage_test: "S25-PF and S25-BB, every fold: mutating every price after the fold's cutoff leaves weights and theta unchanged, by sha256"
  weights_sha256: null  # {fit key: sha256} for every frozen fit; frozen by the D amendment
  thresholds: null  # {S25-PF, S25-BB, S25-PB, S25-PFT: {cell: {theta_long, theta_short}}} for every frozen cell (S25-T's are the 2025 study's); frozen by the D amendment

d_procedure:
  stage_0: "on the reader-test days: the spot readers proven on synthetic fixtures and the three days; Bybit's ob200 replayed as a block day (no positive_prices error, no off-grid price), message counts, median interval and gaps recorded; Bybit's print columns, units and side strings checked; Binance's side flag mapped as documented; fetch, replay, label, fits and scoring timed; print walk tables equal to the print executor entry by entry, on runs whose busy periods depend on the side; stage 0's labels, fits and scores discarded and never reported, only timings, reader checks and parity to the amendment; a failure fixed by a dated amendment before stage 1"
  stage_1: fetch, replay and features of W and D; no H or P file on disk before its read
  code_freeze: docs/spot_2026_code_freeze.md, before the stage 1 fetch
  stages_after: [leakage tests, the fits, scoring of every slot, measured row and neighbourhood cell on June and July, S25-T on the same days, the calibration on Bybit, sigma_D and the MDEs, "a dry run with July standing in for H, outputs discarded", the amendment]
  nulls_descriptive: {null_a: "hour-block sign flips, 999 draws, seeds 0-998", null_b: "day re-pairing over every shift 7 <= s <= 54 of the 61 test days", applied_to: each slot's fixed cell, gates: nothing}
  hand_runs: logged with date and days read; nothing can be chosen, and no amendment may cite one
  run_log: {rows: "every computation on a D test day: its date, its run (a numbered complete D run or a hand run) and the days it read", parts: "data/spot_2026/spot_2026_trials.parquet or its parts <stem>.part<k>.parquet, never committed", manifest: "experiments/results/spot_2026_trials.json: each part's sha256 and rows, the log's sha256 and rows; committed with the D amendment", frozen_in: compute.record.trials, checked: "at H's gate and P's: the manifest committed unchanged at the frozen values, the parts on disk exactly the manifest's"}
  stage_0_records: "per day in the fetch log: the book's message counts and median interval, the share of 100 ms rows in which the clip exceeds ten levels, Bybit's rpi share and side counts, Binance's time unit"

metrics:
  primary: {S25-PF: net_bp_trade, S25-BB: net_bp_trade, S25-T: net_bp_trade}
  net_bp_trade: "a round trip's P&L in quote (a long's exit value less its entry value, a short's entry value less its exit value) over the entry notional x 1e4, less both sides' fees in bp of the entry notional"
  day_series: one value per day with a trade; the day's net in quote summed over its round trips over their summed entry notionals x 1e4
  gross_bp_trade: the same before fees; reported, labelled "conditional on a zero-fee venue"
  gross_bp_turnover: "per day, the day's gross over its turnover (both sides' notional) x 1e4; on a block, the mean over the series' days; the break-even per side, against every tier"
  ic: {book: "rank correlation of p_long - p_short with the mid move from the entry snapshot to the first snapshot at or after it + hold, as in 2025", prints: "the same from the mid proxy at the entry fill to the mid proxy at the first row stamped at or after the fill + hold", prints_entry_fill: "side-free: the first reachable print of either side stamped at or after t + 10 ms", aggregate: mean over days}
  computed_on_day_series: [mean, t, newey_west_t, median_day, K1, K-days, placebos, K-nbhd, sigma_d, mde]  # never on trade rows
  significance: {code: evaluation/significance.py assess, input: one row per day, cluster: day, fewer_than_two_days: fails the day count; p = 1}
  p_value: market_making/verdicts.day_t(daily series).p_one_sided
  newey_west: {kernel: bartlett, lag_days: 5, lag_counts: positions in the daily series}
  mde:
    formula: (3 + 0.84) * sigma_D / sqrt(n_eff)
    n_eff: 75 x the share of D's 61 test days with a trade; on P, P's usable days in place of 75, sigma_D and the share as frozen
    on_P: the frozen MDE x sqrt(75 / P's usable days)
    sigma_d: null  # {slot of the family: sigma} over D's 61 test days; frozen by the D amendment
    value: null  # {slot of the family: mde}; frozen by the D amendment
  beside: [trades_per_day, share_days_positive, median_day, max_drawdown, net_quote_a_day, every_tier, by_side, long_only, inventory_pnl, slot_30_day_volume, entries_skipped, late_snapshots, late_prints, fill_beyond_sweep, beyond_tenth_level, print_brackets, prints_a_day, capacity_ratio, grid_row_share_traded, entry_waits, realised_hold, entries_no_print, exits_no_print]

family: [S25-PF, S25-BB, S25-T]
statuses:
  holm: {alpha: 0.05, sided: one, m: 3, m_fixed_on_every_block: true, code: market_making/verdicts.holm, enter_with_p_1: [void, killed, "inconclusive (too few trades)", not assessed, not taken to the block]}
  holm_first_step_t: {df_74: 2.17, df_19: 2.29, df_9: 2.51}  # below 3: the t >= 3 bar binds
  bar: [no kill, Holm passes with m = 3, day t >= 3, Newey-West t >= 2, median day > 0, "days with a trade: at least 20 on H, at least 10 on P"]
  precedence: ["void (K-leak, K-units, K-acct, K-cap, K-inv)", "inconclusive (too few trades): K-trades; nothing below evaluated", killed (any kill), "inconclusive (fill beyond sweep) or inconclusive (capacity): the bar met but a cap applies", "candidate on H or passes on P: the bar met, no cap", "inconclusive (below the minimum detectable effect when the mean is smaller in size than the MDE)"]
  void_counts_as_killed: true
  taken_to_P: candidate only
  caps:
    fill_beyond_sweep: {slots: print slots, share_of_fills_above: 0.10, status: inconclusive (fill beyond sweep)}
    capacity: {slots: every slot, median_day_ratio_above: 0.02, ratio: measurements.capacity, status: inconclusive (capacity)}
    applied: after Holm; no p-value changes
    strictly_above: true  # a cap applies only above its limit
    both: inconclusive (fill beyond sweep)
    fill_beyond_sweep_share_over: every fill of the true run on the block
    capacity_median_over: every usable day of the block, a day without a trade counting 0
  after_H: [candidate, "candidate (H inside S25's information set)", inconclusive, inconclusive (fill beyond sweep), inconclusive (capacity), "inconclusive (too few trades)", "inconclusive, below the minimum detectable effect", killed, void, "not assessed (H unreadable on <venue>)", "not assessed (H read failed)", "void (defect found after the H read)"]
  after_P: {passes: confirmed, no_pass_no_kill: "candidate, not confirmed", kill: killed on P, void: void, unreadable: "candidate, not confirmed (P unreadable)", read_failed: "candidate, not confirmed (P read failed)", not_read_by_deadline: "candidate, not confirmed (P not read by its deadline)", before_deadline: "candidate (P not yet read)"}  # under information_set.fallback each carries "(H inside S25's information set)"
  unreadable: "a venue's block with more than a quarter of its days excluded; on H that venue's slots not assessed, the other venue's assessed, H spent"
  wording: {venues: [Bybit, Binance], h_unreadable: "not assessed (H unreadable on <Bybit or Binance>)", p_unreadable_measurement: "not assessed (P unreadable on <venue>)", not_taken: "not taken to the block, entering Holm with p = 1", family: "assessed only when every slot has its values or one of these preset statuses; a slot with neither is refused"}
  fallback_mark: "under information_set.fallback on every final status; on H only on candidate; never on void (defect found after the <block> read)"
  P_deadline_anchor: "the 30 days counted from the committer date (UTC) of the commit that first adds experiments/results/spot_2026_H.json; after the deadline no P read opens and no process of a P session starts"
  read_failed: "resumed at the same commit; the same stage failing again with the same exception, or five resumptions unfinished, closes the session: on H every slot not assessed (H read failed); on P every candidate 'candidate, not confirmed (P read failed)' and every measurement not assessed"
  defect_after_read: "stated in docs/spot_2026_defects.md with the mechanism by which it could raise a result; every status it could affect becomes void (defect found after the <block> read)"
  measurements_never_described_as_working: [any tier other than the verdict tier, zero fees, any print bracket, long-only, gap-excluded days put back, any measured row, the inventory's P&L]
  no_zero_taker_cell: "no account could trade either pair at zero taker fees on any day of W, D or H as far as the sources show"

kill_conditions:
  per_slot:
    S25-PF: {execution: taker, print rule, series: net_bp_trade, kills: [K1, K-label, K-placebo, K-drift, K-nbhd, K-days, K-fee, K-latency, K-fill], beside: [every bracket, both calibrations on Bybit (S25-PB), waits, realised holds, late and missing prints, the share of fills beyond the sweep]}
    S25-BB: {execution: taker, book walk, series: net_bp_trade, kills: [K1, K-label, K-placebo, K-drift, K-nbhd, K-days, K-fee, K-latency], beside: [the gap-excluded days put back]}
    S25-T: {execution: taker, book walk, series: net_bp_trade, kills: [K1, K-label, K-placebo, K-drift, K-nbhd, K-days, K-fee, K-latency], beside: [its trade rate against 240 a day]}
  void: [K-leak, K-units, K-acct, K-cap, K-inv]
  K-leak: a feature fails its leakage check (features.leakage_check) or the fold-level leakage test fails; every result void
  K-units: "a cost (fee, book walk, print fill) or the hold-first rule's input reaches the result through a normalised column; or any fill's fee in bp of its notional differs from the fee fees.rule assigns it from the table for its venue, tier and time (every fill of every run)"
  K-acct: the accounting identity fails on any day, or turnover differs from the sum of fill notionals, in any run of the slot's read
  K-cap: the traded position beyond one clip either way at any event
  K-inv: either coin's balance below zero at any event
  K1: the mean of the daily series on the block <= 0
  K-label: the signal's IC on the block <= 0
  K-placebo: "the true mean does not exceed each of the 95th percentile of the random-direction draws, the sign-flipped mean and the one-day-shifted mean"
  K-drift: the true mean does not exceed the larger of the all-long and all-short means at the same entry times
  K-nbhd: {statistic: median over the 12 neighbourhood cells of each cell's mean on the block, kills_at_or_below: 0, cell_without_trade: 0, runs: frozen fits and theta only}
  K-days_share_positive_max: 0.5
  K-fee: {statistic: "metrics.gross_bp_turnover on the block: the mean of the daily values", kills_at_or_below: the verdict tier's taker fee, taker_bp: 10.0}  # weights days as K1 does; can differ from K1 near zero
  K-latency: {latency_ms: 110, kills: a positive result that is <= 0 there, book: one more 100 ms row, prints: the arrival moved by 100 ms}
  K-fill: {slots: [S25-PF], kills: "a positive result whose worse_of_two daily series has a mean <= 0 once every buy is also charged max(0, a_buy) and every sell max(0, a_sell) bp of its notional", a_buy_a_sell: measurements.FILL-S_thinned on Bybit's days of the same block, applied: "after the run, to the worse-of-two trades, whose fills it does not change; a negative advantage charges nothing", day_value: "(net - 1e-4 x (max(0, a_buy) x buy notional + max(0, a_sell) x sell notional)) / entry notional x 1e4, from each day's sums", undefined_a: "a_buy or a_sell undefined: K-fill fires on a positive result"}
  needs_positive_result: [K-latency, K-fill]
  run_without_trade: scores 0  # a placebo, K-drift or K-nbhd run without a trade on the block
  K-units_rel_tol: 1.0e-12  # fees.k_units_rel_tol
  status_only: {K-trades: 100, K-trades_counts: round trips over the block, K-MDE: "below the minimum detectable effect, only when no kill fired"}

placebo_percentile: 95
placebos:
  sign_flipped: {used_by: family}
  random_direction: {used_by: family, draws: 200, seeds: [0, 199]}
  one_day_shift: {used_by: family, source: "the previous usable day's signal tape at the same time of day", circular_within_block: true, steps_over_excluded_days: true}
  all_long_all_short: {used_by: family}  # K-drift
  positions: each placebo on the true slot's entry decision times
  book_slots: a taker's exit time does not depend on its side on a book, so no decision is skipped, as in 2025
  print_slots: "each placebo, K-drift's all-long and all-short runs and Null A's hour flips re-apply the print executor's one-position rule to their own fills: a true decision arriving while the run's own position is open (before its exit fill's print) is skipped, counted and reported; K-cap holds in every run"
  walk_tables: {book: from the 2025 executor's walk, prints: "from the print rule's fill function, storing per decision row both sides' entry fill print, exit fill print and busy-until time; proven equal to the print executor at stage 0, side-dependent busy periods included"}
  print_neighbourhood_and_latency: full runs of the print executor's rule on the rows passing theta
  g_on_prints: "the 2025 ledger's G = side x (pnl_long_bp - pnl_short_bp) / 2 at the decision row; a trade without the other side's fill has no G; a day's G and its parts are means over the trades with one; a day without a trade scores 0"

hypotheses:
  S25-PF: {block: H, claim: net_bp_trade > 0 at regular, kills: kill_conditions.per_slot.S25-PF, prediction: killed by K1}
  S25-BB: {block: H, claim: net_bp_trade > 0 at non_vip, kills: kill_conditions.per_slot.S25-BB, prediction: killed by K1}
  S25-T: {block: H, claim: net_bp_trade > 0 at non_vip with the 2025 frozen fit unchanged, kills: kill_conditions.per_slot.S25-T, prediction: "killed by K1, or inconclusive (too few trades)"}

measurements:
  FILL-S: {what: "the print rule's calibration: S25-PB's and S25-BB's decisions on Bybit priced by the print rule (primary and every bracket) and by the book walk", blocks: [D, H], reported: "per side, the mean and median fill-price difference in bp of mid, the share of late prints, each slot's net_bp_trade both ways", beside: S25-PF, status: never moves one}
  FILL-S_thinned: {blocks: [D, H, P if read], thinning: "per day, Bybit's spot prints drawn at random to BTC/FDUSD's count of aggregated prints that day (all kept if fewer); a day excluded on either venue unused", seeds: [0, 9], decisions: S25-PB's on the full prints, priced_by: [common.print_fill and every bracket on the thinned prints, common.book_fill], reported: per side and seed, mean and median advantage over the book walk in bp of mid (positive when better for the account), a_buy_a_sell: the worse_of_two mean advantage per side over every fill of the ten seeds; read by K-fill}
  capacity: {per_day: "the larger over sides of the slot's taker volume over the venue's taker volume on that side, from its prints", statistic: median over the block's days, beside: [every slot, S25-PB, FILL-S_thinned on the thinned prints], caps_status_above: 0.02}
  FILL-S_pairing: "each order of the book-walk run priced by the print rule at its own arrival: an entry only at a print before 23:59, an exit at any print before the day ends and by the fallback; neither held to a print after an entry fill; the stale bracket at the order's own decision; in bp of the mid of the snapshot the walk used"
  FILL-S_thinned_draw: "uniform without replacement over all of the day's Bybit prints, rpi included, numpy default_rng(seed).choice, archive order kept"
  a_buy_a_sell_pooling: "every fill of every seed and day (fill-weighted); an order the print rule cannot price left out"
  capacity_units: "BTC, every print counting; a side the slot traded and the venue did not print: infinite; a day without a trade: 0"
  measured_rows: measured_rows
  activity_beside_series: each venue's prints a day
  edge_ladder: ["S25-T on spot books (no refit)", "S25-BB (refit on spot books)", "S25-PB by the book walk, then by the print rule", "S25-PF (the other venue)", "each at zero fees, at the verdict tier and at the cheapest tier with a dated source for the block's days"]
  result_D: null  # {slot: {series summary, nulls, theta trade rate}, FILL-S: {...}, labelled development}; frozen by the D amendment

fetch:
  via: this study's fetch (new code, on data/ensure.py's pattern)  # only missing days; archives deleted after replay or conversion
  root: data/spot/<venue>/<plane>/<symbol>/  # never data/{book,trades,bars,funding}/BTCUSDT
  stages:
    0: {when: "after this registration and its code are committed (the owner's amendment of 2026-10-25 lifts the wait for the 2025 study's last read)", what: reader-test days, gb: {bybit_ob200: 0.286, bybit_prints: 0.035, binance_aggtrades: 0.010}}
    1: {when: after stage 0 and the code-freeze note, what: [W, D], gb: {bybit_ob200: 7.363, bybit_prints: 0.564, binance_aggtrades: 0.136}}
    2: {when: "inside H's opened access, after the amendment", what: H, gb: {bybit_ob200: 3.813, bybit_prints: 0.339, binance_aggtrades: 0.064}}
    3: {when: "inside P's opened access, only for a candidate", what: P, gb_estimated: {bybit_ob200: 3.6, bybit_prints: 0.26, binance_aggtrades: 0.06}}  # at D's daily means; P's own HEAD check records the sizes
  total_gb_stages_0_to_2: 12.610
  failures: "the 2025 fetch plan's: every day listed as present fetched; any failure other than HTTP 404 retried with backoff; a stage complete only when every such day is on disk or excluded by a terminal rule (unreadable archive, unfetchable day); checksums checked before reading"
  replay_workers_max: 4
  disk_peak_gb: [12, 19]  # books at 40-60 MB a replayed day (the 2024 perpetual figure; stage 0 measures spot)
  disk_margin_gb: 10  # free disk, measured when each stage starts (stage 0 included), must exceed the stage's budget by this much; otherwise the stage waits; each measurement recorded
  free_disk_gib: {2026-10-22: 66, 2026-10-24: 59}
  stage_budget_gb: 19  # the peak's upper end, for every stage, so each needs more than 29 GB free
  disk_poll_s: 600  # a waiting stage measures again this often; every measurement appended to a JSON record
  days_requested: "every day a stage asks for, listed or not; a 404 on a day the head check listed is noted"
  not_before: "this registration and its code committed; the 2025 study's files are never written or deleted by this study, and the disk margin decides whether a stage may start (owner's amendment of 2026-10-25)"

compute:
  estimate: "about 200 book days replayed at 2-3 minutes on at most 4 workers; 42 boosted fits at 1-2 minutes; scoring, placebos and neighbourhoods from walk tables; under a day for D, a few hours for each later read"
  record: null  # stage 0's timings and checks (ten-level share, unreachable-print share, median sweep against the clip), free disk at each stage's start, the replay's peak memory, worker counts and store sizes, and the run log's {sha256, rows} under trials (d_procedure.run_log); frozen by the D amendment

access:
  development: {allows: [reader_test, W, D], venues: both, refuses: "every other day of both instruments, 2025 and 2026 alike"}
  planes: {bybit_spot_BTCUSDT: [book, prints], binance_spot_BTCFDUSD: [prints]}
  reader_test_purposes: ["readers' proof", stage 0 timing, dry run]  # an access to the reader-test days alone, stamped "reader test (<purpose>)"; the development access allows them too
  no_file_on_disk: "no path under data/spot/ names an ISO date of the block, or a month (YYYY-MM without a day) that holds one"
  H_also_requires: "the run log's manifest committed unchanged at the amendment's sha256 and rows, its parts on disk exactly as listed (d_procedure.run_log)"
  P_opens: "once, for exactly the slots that were candidates in H's first read, when the archives publish 2026-12-31 on every plane of both venues"
  open_entry_where: "HEAD's ledger only: nothing is pushed and no remote is checked; the owner keeps intermediate work unpublished"
  ledger: experiments/results/spot_2026_ledger.json
  guards: [H, P]
  H_opens_if: ["the amendment records this file's sha256 and the file on disk has it and is committed", the tree clean but for the ledger, "every frozen fit's, frozen slot file's and the fitted-values file's sha256 equal the amendment's", "the 2025 files S25-T loads equal slots.S25-T's sha256s, and configs/short_horizon_2025.yaml equals slots.S25-T.config_2025_sha256", no file of H on disk]
  every_open_and_process: ["git diff --name-only <session's commit>..HEAD lists nothing but the ledger", the environment fingerprint equals the one H's open entry records]
  open_entry: "committed before the block's fetch begins: block, session commit, configuration sha256, fingerprint, UTC time; every later process and open refuses unless it is in HEAD's history"
  session: "bound to (block, commit, configuration sha256, fingerprint); closes by writing experiments/results/spot_2026_<block>.json and its sha256 into the ledger"
  P_opens_if: "a candidate on H, by blocks.P.deadline; H's results file committed unchanged; the diff since H's read lists only README.md, paths under experiments/results/ and paths under docs/ outside docs/preregistration/, except that the fee amendment may add P's intervals to the document's amendments and to fees.intervals and nothing else (this file with those intervals removed has H's sha256)"
  second_read: raises unless forced; stamped second read; cannot change a status
  spent: blocks.spent

amendment:
  D_amendment: {when: after D and before H, written_by: the entry point, reviewed_before_commit: true, records: [excluded days by venue and reason, max_sequence_gaps, tick and lot, reader-test results, every frozen fit's sha256, each slot's frozen file sha256, the fitted-values file's sha256, every theta, sigma_D and the MDEs, D summaries against the nulls (development), FILL-S and FILL-S_thinned on D, common.book_levels.walk, the compute record, "Frozen configuration sha256: `<hash>`"]}
  placeholder_comment: frozen by the D amendment
  corrections_before_H: "a dated amendment stating the fault; D re-run in full if it could change a D number; complete D runs numbered; every change to the study code after the code-freeze note is one"
  forbidden_reasons: [a D number, a result of the 2025 study, anything seen on spot data, except a fault the amendment names]
  fee_amendment: {only_after_H: true, adds: "intervals for P's days, by fees.P_procedure, by blocks.P.deadline and before P opens", changes: nothing else}
  after_H: nothing changed and nothing re-run under another rule; a defect can only lower a status (statuses.defect_after_read)
  ledger_rule: only reads through the ledger count; a number computed on H or P outside it is not a result
  date: null  # the D amendment's date; frozen by the D amendment
  null_hash_line: "an amendment that changes this file outside its placeholders records 'Null-placeholder sha256: `<hash>`' under the document's Amendments; the latest is accepted, a superseded one refused"
  fee_amendment_form: "each P interval one line under fees.intervals.<instrument>, starting at or after 2026-10-22T00:00:00Z, overlapping none, with its sources and the verdict tier's fees; only on a frozen file; removing them gives H's sha256; the document's amendments only appended to"
  information_set_amendment: {when: before stage 0 and before any spot file is fetched, by: the owner, sets: information_set.confirmed, records: the configuration's new sha256, changes: nothing else, absent: information_set.fallback holds}

artefacts:
  files: [experiments/results/spot_2026_ledger.json, experiments/results/spot_2026_H.json, experiments/results/spot_2026_P.json]
  page: one row per slot and measured row (status, first kill against its reference, mean, t, Newey-West t, median day, trades, MDE, placebo percentile, K-nbhd median, break-even per side against every tier, brackets, calibration) and the edge ladder
  headline_sentences:
    each_slot_on_H: "[slot] on H, [venue] spot [pair]: [status]; first kill [K-x] at [value] against [reference]."
    S25-PF: "S25's coordinates on nine print inputs, on Binance BTC/FDUSD, August to October 2026: gross edge [x] bp of turnover against the 10 bp taker fee a Regular account paid; break-even [y] bp per side; [status]."
    S25-T: "S25 as frozen on Bybit's perpetual, unchanged on Bybit's spot book: [n] trades a day against 240 registered; [status]."
    calibration: "On Bybit's spot book, the print rule priced buys [x] bp and sells [y] bp [better / worse] than the book walk."
    P: "[slot] on P: [status]."
  first_kill: the first that fires in the order of the slot's kills
  filling: {venues: {binance_spot_BTCFDUSD: Binance spot BTC/FDUSD, bybit_spot_BTCUSDT: Bybit spot BTCUSDT}, no_kill: "none at n/a against n/a", decimals: 2, units: {K-label: "(rank IC)", K-days: "(share of days positive)", K-fee: bp per side, other: bp}, S25-PF: "[x] and [y] both its gross_bp_turnover on H; with its H status", S25-T: "[n] round trips over H's usable days, one decimal; with its H status", calibration: "FILL-S on H, S25-PB's decisions under the primary rule, the mean advantage per side in bp of mid; the larger in size picks better or worse for both sides, each value written in that direction; not written when unmeasured", P: one sentence per slot taken to P}
  d_numbers_quoted_as_results: false
  frozen_slot_files_sha256: null  # {row: sha256} of each frozen slot file of the five rows (configuration, weights, theta, fitted values); checked by the H and P gates; frozen by the D amendment
