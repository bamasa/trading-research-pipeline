    Y7: {url: "https://api.bybit.com/v5/spot-margin-trade/data?currency=BTC", what: BTC borrow rate and limit on 2026-10-23; not used}

blocks:
  reader_test: {days: [2026-03-03, 2026-03-04, 2026-03-05], venues: both, use: "the spot readers' proof, stage 0's timing and the dry run; nothing else", reads: free}
  W: {role: warm_up, start: 2026-04-01, end: 2026-04-30, days: 30, venues: both, scored: false, use: "Bybit spot's touch size; rolling history", reads: free}
  D: {role: development, start: 2026-05-01, end: 2026-07-31, days: 92, venues: both, test_months: [2026-06, 2026-07], test_days: 61, reads: free}
  E: {role: embargo, start: 2026-08-01, end: 2026-08-07, days: 7, fetched: false}
  H: {role: held_out, start: 2026-08-08, end: 2026-10-21, days: 75, venues: both, slots: [S25-PF, S25-BB, S25-T], reads: 1, read_after: the D amendment is committed}
  P: {role: prospective, start: 2026-11-01, end: 2026-12-31, days: 61, venues: both, reads: 1, condition: a slot is a candidate on H, read_after: "H's results are committed, P's last day is published on both venues and the fee amendment covers P's days", deadline: "the later of 2027-01-31 and 30 days after H's results are committed; the fee amendment and P's read both by then; no P read opens after it"}
  P_embargo: [2026-10-22, 2026-10-31]  # holds the registration day
  set_by: "BTC/FDUSD's fall in activity after 2026-01-28: every 2026 block after it; one calendar for both venues"
  days_independent: true  # flat at every midnight; a day is the rows stamped in [its midnight, the next)
  rolling_reads: earlier days of the same block, and W before D
  cold_start: [H's first day, P's first day, a day whose previous calendar day has no usable plane on that venue]
  cold_start_unscored_minutes: 61  # a 60 s window plus 3,600 s of winsorising, rounded up
  never_in_a_block: [2026-01-05, 2026-01-06, 2026-01-07]  # the 2025 study's reader-test days; not read here
  spent: "H and P, for these slots; a successor uses days after 2026-12-31 and never this study's reader-test days"
  no_block_in_2025: "the 2025 registration spends its H, F and P for every configuration of its catalogue and confines a 2026 confirmation to dates after 2025-12-31, read by date"

common:
  clip_btc: 0.010  # every slot, no sizing
  max_position_clips: 1  # one position at a time
  latency_ms: 10
  times: quantities in seconds measured on row stamps; t + h is the first row stamped at or after t + h
  day: {no_entry_before: "00:01", no_entry_after: "23:58", flatten_at: "23:59"}
  funding: none
  accounting_identity: checked at every day's end; turnover equal to the sum of fill notionals
  report_per_100_quote_of_clip: true  # the sum over the day's trades of net over entry notional x 100, the 2025 form, no funding
  short_side:
    mode: inventory  # shorts from held inventory
    day_start: {base_clips: 1, quote_clips_at_first_print: 3}
    long: buys a clip with quote and sells it at its exit
    short: sells the held clip and buys it back at its exit
    trade_pnl: a long's or a short's of one clip, fees and turnover included
    inventory_pnl: "the held clip marked from the day's first print to its last; reported separately, never in net_bp_trade, a kill or a status"
    long_only_measured: short decisions dropped before the one-position rule; K-drift's all-long version is its comparator
    k_inv_checks: [fees booked in quote (fees.booking), "each fee deducted in the asset received, the day starting with 2 clips of BTC (the second covers 1,000 buys at 10 bp)"]
    margin_borrow: not modelled
    inventory_marks: "the day's first and last print in archive order, either side (on Bybit its prints, for the book slots too)"
    k_inv_tolerance: {base_clip_share: 1.0e-12, quote_start_share: 1.0e-9}  # below these, not at zero: rounding cannot fire K-inv
    k_acct: "per booking: at the day's end BTC is the start's, less the fees deducted in BTC under the second booking; the quote's change is the trades' net, plus those fees' value at their fills"
    book_exit_account_time: the later of its snapshot and its arrival
  book_fill: {slots: [S25-BB, S25-T, S25-PB by the book walk], executor: "the 2025 event-time taker executor (backtest/taker.execute_day), unchanged: ten-level walk, entry skip beyond the visible depth, late-snapshot counters, flatten_stale (R16)", funding: none, fee: the fill's from the fee table, settings: "built only by this study's costs.py from the fee table; a run given the executor's default settings (5.5 bp taker) is refused; tested"}
  book_levels:
    features: 10
    stage_0_check: share of reader-test snapshots in which the clip exceeds ten levels on either side
    walk_rule: "10 levels; 200 if the stage-0 share is above walk_threshold; features keep ten"
    walk_threshold: 0.001
    walk: null  # 10 or 200 by walk_rule; frozen by the D amendment
  print_fill:
    slots: [S25-PF, S25-PB, S25-PFT]
    arrival: decision + 10 ms
    buy: the first buyer-initiated print stamped at or after arrival
    sell: the first seller-initiated print stamped at or after arrival
    unreachable_prints: "stage 0 checks each print archive for an RPI flag or equivalent; flagged prints never filled against, kept in the features; their share recorded"
    clip: "walks that print and the other same-side prints with the same stamp, in archive order, at their volume-weighted price; the part beyond that sweep at the sweep's last price, counted (fill_beyond_sweep)"
    stage_0_sweep: the median sweep against the clip, recorded
    skips: none  # no entry skipped for depth or for wait
    late_print_s: 1  # a fill whose print comes later after arrival is counted (entry_late_print, exit_late_print); no day excluded
    exit_decision: "as the print label: the first row stamped at or after the entry fill's print + hold, or 23:59 if that comes first; never fills on a print before the entry's fill"  # a registered change from S25's executor (decision + hold)
    next_decision: "at a row stamped at or after the later of the exit's fill print and its arrival (busy_until_ns)"
    no_later_print: {entry: "not made, counted (entries_no_print)", exit: "priced at the last print of its side before it, counted with its age (exits_no_print)", excludes_a_day: false, next_day_read: false}
    reported_beside: [entry wait distribution, realised hold (entry fill to exit fill), entries_no_print, exits_no_print and ages, fill_beyond_sweep share, unreachable print share]
    same_function_for_label_and_executor: true  # spot/fills.py round_trips and fill_orders; the walk tables call it through the executor
    reachable_only: "sweeps, the pessimistic window and the stale price use reachable prints only (not rpi)"
    beyond_tolerance_clip_share: 1.0e-9  # a part beyond the sweep at most this share of the clip is none, and not counted
    fill_time: "the print's stamp, also the fee's instant; the executor's entry print before 23:59, the label's before the day ends, an exit's before the next midnight; an exit never on a print stamped before the entry's fill"
    each_decision_alone: "each round trip computed as if it were the only one; the executor then applies the entry hours and the one-position rule"
    no_exit_row: "no row stamped at or after the entry fill's print + hold: the executor's exit decided at 23:59; the label's round trip has no exit and its row no label (the label has no 23:59)"
    exit_fallback: "no later print of its side: the whole clip at the last reachable print of its side at or before its arrival, even before the entry, else of either side (exits_no_print_either_side); no sweep, nothing beyond; its wait negative (the print's age); its fill time its arrival"
    brackets:
      optimistic: the whole clip at the first print's price
      pessimistic_depth: "the part beyond the sweep at the worst price of a same-side print stamped in the 60 s after the fill's print and before 23:59; the sweep's last price if none"  # spot/fills.py names it pessimistic; the window (s, s + 60 s], the fill's stamp s excluded, its literal worst
      stale: "the last print of the same side stamped at or before the decision row; the rule's price when the day has none before it"
      worse_of_two: "per fill the worse of the rule's price and the stale price, with pessimistic depth; pessimistic depth alone when there is no stale print"
      fallback_exit: "rule, optimistic and pessimistic at the fallback print; stale and worse of two read the exit's decision as for any fill"
    K-fill_bracket: worse_of_two  # less the thinned calibration's advantage (kill_conditions.K-fill)
    brackets_are_bounds: false  # four registered rules; none bounds a real account's fill

