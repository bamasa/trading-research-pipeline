    hold_s: 50
    rule: hold_first
    trades_per_day: 240  # as registered in 2025; the frozen theta may trade at another rate on spot, which is measured
    gate: open
    regime: none
    execution: taker in, taker out after hold, common.book_fill
    short_side: common.short_side
    verdict: net_bp_trade at non_vip (10 / 10 bp)
    neighbourhood: {hold_s: [20, 50, 120], trades_per_day: [100, 240], label_fee_bp: [0, 5.5]}  # 12 cells on the 2025 frozen fits below
    neighbourhood_fits_2025:
