# S25 on spot, Binance BTC/FDUSD and Bybit BTCUSDT, on 2026 data: the
# machine-readable half of the pre-registration.
#
# docs/preregistration/spot_2026.md is the other half: it says what each value
# means and why it was chosen. The two were committed together on 23 October
# 2026, on the local branch spot/prereg, before any spot book, print, trade or
# bar file of any year was fetched for this study. They must agree.
#
# Every value here is fixed now, except those set to null with the comment
# "frozen by the D amendment". Those are set on block D and written into this
# file by the single dated amendment, before block H is read. The amendment
# records the sha256 of this file after that write; the study's ledger refuses
# to open a held-out block unless the file on disk has it and is committed and
# clean. Nothing else here changes, except under the document's amendment
# protocol (the owner's information-set amendment may set
# information_set.confirmed before stage 0; the fee amendment may add
# intervals under fees for P's days).
#
# Conventions of the 2025 study hold: units in the key's suffix (_bp, _ms, _s,
# _btc, _gb, _mb), UTC dates inclusive, seed ranges inclusive. Instruments are
# keyed by venue and market, never by symbol alone.
#
# The study's code reads this file: spot/registration.py validates it against
# the code's constants and its registered sha256, and spot/costs.py reads the
# fee table from the fees block when it runs. The choices the code made where
# the document left one open (its "Choices the code made", 25 October 2026)
# are written in their sections below, before any day of a block is fetched.

name: spot_2026_preregistration
registered: 2026-10-23
registered_against: "1a317b1"  # sh2025/prereg, the branch this one starts from
document: docs/preregistration/spot_2026.md
registers: a confirmation of S25 on spot; three slots under Holm with m = 3
searched: false  # no value chosen on an outcome; no catalogue, no placebo search
instruments:
  binance_spot_BTCFDUSD: {id: "binance-spot:BTCFDUSD", venue: binance, market: spot, symbol: BTCFDUSD, quote: FDUSD, role: primary, book: none}
  bybit_spot_BTCUSDT: {id: "bybit-spot:BTCUSDT", venue: bybit, market: spot, symbol: BTCUSDT, quote: USDT, role: secondary, book: ob200}
computed_before_registration: "the format probe of 2026-10-25 only: bytes 0-4095 of one 2026-03-03 file per plane, for their layout (data.format_probe); no other spot byte of any year fetched or opened by this repository"

prior_information:
  - "BTC's daily price path to 2026-09-30, in the README's break figure (Binance BTCUSDT daily futures bars on disk); the shorter-memory setting's scale breaks 2026-02-06 up and 2026-08-14 down, named in the README; the second inside H; neither set any value"
  - "BTC/FDUSD: the author worked on this pair in 2025"  # an information-set fact; nothing more is stated
  - "the 2025 study's registration, configuration and code, S25's coordinates and frozen-file sha256s, and its D amendment of 2026-10-18 (development numbers on Bybit's BTCUSDT perpetual, 2025-01..06); S25's coordinates set every coordinate of the three slots; the sha256s are checked, not chosen; the D amendment's numbers set nothing here; S25 was named on 2026-10-08, when 61 of H's 75 days had passed (information_set); its held-out results will be known before this study's D is read and change nothing here"
  - "the 2025 study's reader-test days 2026-01-05..07 (Bybit linear ob200), read for message counts; in no block here"
  - this repository's earlier studies on perpetuals, documented in docs/findings.md; the reason for the prior
  - "fee schedules sourced on 2026-10-22..23 (fees block); Binance BTC/U at zero fees for every account 2026-04-17..07-16; BTC margin borrow rates on both venues; FDUSD's departure from its peg on 2025-04-02 (public news)"
  - "HTTP HEAD and directory listings on 2026-10-22: every Bybit spot ob200 day 2025-04-01..2026-10-22, every Bybit spot daily print file, the S3 listings of Binance spot BTCFDUSD (and BTCUSDT, BTCUSDC for reference), 72 HEADs on Binance's archives (the 66 on listed files matched the listed sizes), no Binance spot book; sizes seen, H's included (data.head_check)"
  - "the format probe of 2026-10-25 (data.format_probe): the layout of one 2026-03-03 file per plane, its ob200 messages 200 ms apart; it set the readers' contracts and no value"
information_set:
  s25_coordinates: {named: 2026-10-08, by: "the 2025 registration, commit f7cf0bc", h_days_elapsed_when_named: 61, stated_end: none}  # not claimed chosen without knowledge of market conditions after 2025-08-01
  binance_spot_BTCFDUSD: {statement: the author worked on this pair in 2025, taken_to_end: 2025-12-31}
  bybit_spot_BTCUSDT: {statement: none}
  confirmed: {s25_coordinates: 2025-12-31, binance_spot_BTCFDUSD: 2025-12-31, bybit_spot_BTCUSDT: never}  # {s25_coordinates, binance_spot_BTCFDUSD, bybit_spot_BTCUSDT}: the end dates the owner confirms, set only by one dated amendment committed before stage 0; null: not confirmed
  blind_if: every confirmed end date before held_out_start  # preferably before first_fitted_day
  fallback: "unless blind_if holds: H inside S25's information set; each slot's best status on H is 'candidate (H inside S25's information set)'; P the only confirmatory block; every status of statuses.after_P carries '(H inside S25's information set)'"
  first_fitted_day: 2026-05-01
  first_scored_day: 2026-06-01
  held_out_start: 2026-08-08
  days_of_2025: never read  # the 2025 registration's spent-blocks rule confines a 2026 confirmation of S25 to dates after 2025-12-31

expected_outcome:
  verdict_taker_bp: {binance_spot_BTCFDUSD: 10.0, bybit_spot_BTCUSDT: 10.0}
  taker_round_trip_bp: 20.0  # a slot pays at the verdict tier only with a gross edge above 10 bp of turnover
  cheapest_dated_taker_bp: {binance_vip9: 2.3, bybit_vip5: 5.0}  # with a dated source for the blocks' days
  undated_taker_bp: {bybit_supreme_vip: 4.5, bybit_pro6_institutional: 1.5, read: 2026-10-22..23}  # Y3, Y5 live; no earlier date
  predictions:
    S25-PF: killed by K1 on H
    S25-BB: killed by K1 on H
    S25-T: "killed by K1 on H, or inconclusive (too few trades)"
    every_slot: gross_bp_turnover below 10, so K-fee fires too
    not_predicted: [the sign of any gross edge at zero fees, the size of the print rule's bias]

data:
  bybit_book:
    instrument: bybit_spot_BTCUSDT
    url: "https://quote-saver.bycsi.com/orderbook/spot/{symbol}/{day}_{symbol}_ob200.data.zip"
    present: [2025-04-29, 2026-10-21]  # 2025-04-01..04-28 return 404; no gap after
    levels: 10
    grid_ms: 100
    rows: "data/bybit.reconstruct at grid_ms 100, source tag bybit-spot-ob200: at most one row per 100 ms interval, at its first update, stamped with that update's venue time; no forward fill"
    message_shape: "the linear archive's (topic, ts, type, data {s, b, a, u, seq}, cts) in the format probe; the whole of each reader-test day checked at stage 0"  # Bybit documents a 100 ms push for spot level 200, RPI orders excluded
    message_interval: "200 ms between the format probe's fourteen messages, against the documented 100 ms; stage 0 records the median interval on the three reader-test days; nothing depends on it"
    row_symbol: "bybit-spot:BTCUSDT"  # Bybit's linear perpetual is also BTCUSDT
    replay_levels: "10, or common.book_levels.walk when stage 0 sets 200; the features read the first ten"
  bybit_prints:
    instrument: bybit_spot_BTCUSDT
    url: "https://public.bybit.com/spot/{symbol}/{symbol}_{day}.csv.gz"
    present: [2022-11-10, 2026-10-21]
    columns: "id,timestamp,price,volume,side,rpi in the format probe: millisecond stamps, lower-case sides, rpi 0 or 1; checked at stage 0; a new parser, never data/bybit_trades.parse"
  binance_prints:
    instrument: binance_spot_BTCFDUSD
    url: "https://data.binance.vision/data/spot/daily/aggTrades/{symbol}/{symbol}-aggTrades-{day}.zip"
    present: [2023-08-04, 2026-10-21]
    checksum: the published .CHECKSUM file
    checksum_rules: "never read unchecked: an unfetchable .CHECKSUM (a 404 included) is transient, then the day unfetchable; a sha256 mismatch is corrupt, the day unreadable after the second"
    columns: "headerless, eight fields (the format probe); microsecond stamps, the unit taken by magnitude; is_best_match false rows counted, not dropped"
    side: is_buyer_maker true is a seller-initiated print (aggressor -1), false a buyer-initiated one (+1)
    fetch: daily files only
  binance_book: none  # no bookTicker or bookDepth for spot, any symbol or period
  not_fetched: [Binance raw trades, Binance klines, any day of 2025 on either venue, E]  # spot has no funding
  print_grid: "one row per 100 ms interval holding at least one print, stamped at its first print and carrying the state right after every print with that stamp; later prints of the interval belong to the next row; no row without a print"
  print_alignment: "backward: row t holds the prints in (s_t-1, s_t]"
  print_grid_intervals: "[k x 100 ms, (k + 1) x 100 ms) counted from the epoch, so from every midnight; every print counts, rpi included"
  print_contract: {columns: [timestamp, price, size, aggressor, trade_id, rpi, source], timestamp: UTC nanoseconds, aggressor: "+1 buyer-initiated, -1 seller-initiated", rpi: a print no order can reach, sort: "by time, stable: prints sharing a stamp keep the archive's order", binance_rpi: never}
  parsers: "strict: Bybit's sides lower case, millisecond stamps in 2020..2099, rpi 0 or 1; Binance's stamps one unit within a day of the file's date; price and size positive; a file breaking the contract is a replay failure, its day unreadable"
  files: "data/spot/<venue>/<plane>/<symbol>/<day>.parquet; venue bybit or binance, plane book or prints; book files keep the day's sequence-gap count"
  format_probe: {date: 2026-10-25, note: docs/spot_2026_format_probe.md, read: "bytes 0-4095 of one 2026-03-03 file per plane, nothing else", found: "ob200 in the linear shape, its 14 messages 200 ms apart; Bybit prints id,timestamp,price,volume,side,rpi; Binance aggTrades headerless, 8 fields, microseconds", sets: "the readers' contracts; no value"}
  head_check:
    date: 2026-10-22
    method: HTTP HEAD and directory listings only; no file read
    file: experiments/results/spot_2026_head_check.csv  # one row per day, 2025-01-01..2026-10-22: status, size and Last-Modified per archive
    file_sha256: 47116745192b01b4b3cec52fbfaf81da0f8da643524226c5d8e41e12e61ca010
    set_from_it: "the block boundaries (every 2026 block after BTC/FDUSD's fall in activity), the fetch sizes and the disk budget; nothing else"
    activity_fall: {instrument: binance_spot_BTCFDUSD, after: 2026-01-28, factor: about 30, settled_from: 2026-05, raw_trades_mb_a_day_settled: about 1}  # the raw trades archive, not fetched; aggTrades run 10-25% smaller
  sizes_gb:
    reader_test_days: {bybit_ob200: 0.286, bybit_prints: 0.035, binance_aggtrades: 0.010}
    W: {bybit_ob200: 1.912, bybit_prints: 0.178, binance_aggtrades: 0.043}
    D: {bybit_ob200: 5.451, bybit_prints: 0.386, binance_aggtrades: 0.093, largest_ob200_day_mb: 153}
    E: {bybit_ob200: 0.296, bybit_prints: 0.018, binance_aggtrades: 0.003, fetched: false}
    H: {bybit_ob200: 3.813, bybit_prints: 0.339, binance_aggtrades: 0.064, largest_ob200_day_mb: 114}
  reader_test_days: [2026-03-03, 2026-03-04, 2026-03-05]  # both venues; outside every block; for the readers' proof, stage 0's timing and the dry run only
  reader_test_result: null  # {instrument: {day: {status, stream, findings, passes}}} on the three days: each loaded as a block day, with message counts, median interval, sequence gaps and every finding; frozen by the D amendment
  exclusions_unit: day and venue  # a day excluded on a venue is excluded from every series of that venue's slots
  exclusions_bybit: [more book sequence gaps than max_sequence_gaps, a positive_prices error in validate_book's report, an off-grid price (the day's own tick from events.derive_tick), missing plane (HTTP 404 only), unreadable archive, unfetchable day, flatten_stale in any run of the block's read]
  exclusions_binance: [missing file (HTTP 404 only), a day without a print, an off-grid price, unreadable file, unfetchable day]  # an order with no later print of its side is counted (common.print_fill.no_later_print), never an exclusion
  exclusions_both: [fee not sourced]  # a day the fee table does not cover at every instant
  exclusion_reasons: [no_book_file, non_positive_price, off_grid_price, sequence_gaps, no_prints_file, no_print, missing_plane, unreadable, unfetchable, fee not sourced]
  header_only_print_archive: no_print
  off_grid: "each plane against its own tick that day, rpi prints included; Bybit's prints off grid exclude the day on Bybit; a day with one distinct price has no tick of its own, noted, not excluded"
  tick_and_lot_fields: {bybit: [priceFilter.tickSize, lotSizeFilter.basePrecision], binance: [PRICE_FILTER.tickSize, LOT_SIZE.stepSize]}  # neither endpoint called yet
  max_sequence_gaps_rule: "95th percentile of D's per-day gap counts on Bybit's spot book, numpy linear interpolation over every D day whose book file replayed, rounded to 9 decimals, then up; the same value on every block (data/study_loader.max_sequence_gaps)"
  max_sequence_gaps: null  # one value, by the rule above; frozen by the D amendment
  excluded_days_D: null  # {instrument: [[day, reason]]}, each day of W or D; frozen by the D amendment
  instrument_spec: null  # {instrument: {tick, lot}} from each venue's spot specification; frozen by the D amendment
  unreadable_block: more than a quarter of a block's days excluded on a venue; that venue's slots not assessed, nothing retuned
  gap_days_included_reported: true  # each Bybit verdict also with the gap-excluded days put back, as a measurement

fees:
  rule: "every fill pays the fee of the sourced interval of its venue in force at the fill's time, in bp of the fill's notional; a day is covered when every instant of it lies in a sourced interval of its venue (intervals may split a day; on such a day, possible only in P, the book executor, which charges one fee a day, runs at the day's higher fee of each tier); a day not covered is excluded on that venue, reason fee not sourced"
  booking: "in the quote at the fill price, a convention: the venues deduct a fee in the asset received (a buy's in BTC) unless a discount token pays it; equal in value; K-inv checked both ways (common.short_side)"
  verdict_tier: {binance_spot_BTCFDUSD: regular, bybit_spot_BTCUSDT: non_vip}  # the tier an account holds with no 30-day volume, coin holdings or programme membership
  discounts_applied: none  # a discount needs BNB or MNT held, a coin holding outside the verdict tier; the sources do not say whether BNB's discount applied to BTC/FDUSD's taker fee at all
  other_tiers: measurements, labelled with what they require; a zero fee at a tier labelled "conditional on <tier> eligibility"
  tier_values: "[maker_bp, taker_bp]"
  read_by_the_code: at run time, from this block (spot/costs.py); the fee amendment changes no code
  interval_bounds: "[start, end) UTC: an instant on a boundary belongs to the later interval"
  overlap: each side's higher fee at every tier
  coverage: "per tier; only the verdict tier excludes a day; a measurement at another tier is refused on a day that tier does not cover"
  book_executor_day_fee: the day's higher maker and higher taker fee, each taken apart
  k_units_rel_tol: 1.0e-12
  intervals:
    binance_spot_BTCFDUSD:
      - {start: "2024-04-25T06:00:00Z", end: "2026-01-29T00:00:00Z", sources: [B3, B4, B6, B8], tiers: {regular: [0.0, 10.0], vip1: [0.0, 10.0], vip2_to_vip9: [0.0, 0.0], spot_liquidity_provider: [0.0, 0.0]}, notes: "Regular and VIP 1 volume on the pair counted toward the VIP tier, VIP 2-9 volume did not; covers no block"}
      - {start: "2026-01-29T00:00:00Z", end: "2026-10-22T00:00:00Z", sources: [B4, B5, B6, B7, B8], tiers: {regular: [0.0, 10.0], vip3: [0.0, 6.0], vip9: [0.0, 2.3]}, notes: "maker 0 for every account, taker each tier's standard taker; the pair's volume counts toward VIP tiers; end: the live capture of 2026-10-22; only the tiers the sources state for the pair; B8 20260110, 20260324, 20260830 and live agree on VIP 3 and VIP 9, so the interval runs across B12's threshold change of 2026-03-18"}
    bybit_spot_BTCUSDT:
      - {start: "2025-01-31T00:00:00Z", end: "2026-10-22T00:00:00Z", sources: [Y1, Y2, Y6], tiers: {non_vip: [10.0, 10.0], vip1: [6.75, 8.0], vip2: [6.5, 7.75], vip3: [6.25, 7.5], vip4: [5.0, 6.0], vip5: [4.0, 5.0]}, notes: "identical in the captures of 2025-01-30, 2025-08-15, 2026-01-13 and 2026-06-11 and live on 2026-10-22, with no fee change or zero-fee offer on BTC spot in the announcements of 2024-11..2026-10; taken to hold between captures on that ground; starts on the first whole day after the first capture"}
  undated_cells:
    bybit_spot_BTCUSDT: {read: 2026-10-22..23, sources: [Y3, Y5], tiers: {supreme_vip: [3.0, 4.5], pro6_institutional: [0.5, 1.5]}, covers: no day of any block}  # quoted only as the schedule read then
  requirements:
    binance_vip2_2025: ">= 5M USD of 30-day spot volume and >= 100 BNB (B10)"
    binance_2026_thresholds: not transcribed (B12); no tier other than Regular is said to be within a slot's reach
  slot_volume_reported: true  # every slot's own 30-day traded volume beside the tier rows; never moves the verdict tier
  not_covered: [regional entities of either venue, fees an account negotiated]
  P_days: not covered; a dated fee amendment adds intervals for them by fees.P_procedure, by blocks.P.deadline and before P opens, and adds nothing else
  P_procedure:
    sources: {binance: [B5 live, B7 live, B6 captures, B8 captures, "announcements of B3 and B4's kind in Binance's announcement list for the pair"], bybit: [Y1 captures, Y2 live, Y6 scan]}
    retrieved: between 2027-01-01 and the fee amendment's commit
    conflict: the higher verdict-tier fee on each side at that instant
    between_sources: the schedule holds between two dated sources that agree with no fee announcement for the pair between them, on both venues
  sources:
    binance_announcement: "https://www.binance.com/en/support/announcement/detail/{code}, read through https://www.binance.com/bapi/composite/v1/public/cms/article/detail/query?articleCode={code}"
