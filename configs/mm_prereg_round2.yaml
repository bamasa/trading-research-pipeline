0, criterion: A1, admitted: true}, {symbol: IOTAUSDT, tick_bp: 3.844, spread_bp: 4.262, share_two_ticks: 0.1091, touch_over_print: 64.51, prints_per_day: 47248, markout_1s_bp: 0.7149, markout_5s_bp: 0.5601, markout_30s_bp: 1.821, coverage_D: 1.0, coverage_H: 1.0, sequence_gap_days_D: 0, criterion: none, admitted: false}]  # frozen by the D amendment

fees:
  base: {maker_bp: 2.0, taker_bp: 5.5}
  pro1_altcoin: {maker_bp: 0.0, taker_bp: 2.8}  # backtest/costs.py BYBIT_LINEAR_TIERS
  programme: {maker_bp: -1.0, taker_bp: 2.8}  # BYBIT_MM_PROGRAMME_MAKER_BP; taker assumed equal to pro1_altcoin
  caveat: backtest/costs.py BYBIT_FEE_CAVEAT  # the 2026 schedule applied to 2024
  b3_also_reported_with_taker_bp: 5.5

simulator:
  same_as: round one  # configs/mm_prereg.yaml section simulator, with Amendment 1
  code_at: "3071de7"
  changes: only by a dated amendment
  cache_key_includes_source_hash: true
  clip:
    rule: min(notional_usdt, touch_share x trailing one-hour median touch), rounded down to the lot
    notional_share_of_d_median_touch: 0.10
    touch_share: 0.10
    notional_usdt: {GALAUSDT: 1155.59, JTOUSDT: 329.896, ALGOUSDT: 616.439, ZECUSDT: 100.07, CAKEUSDT: 102.52, ALICEUSDT: 155.986}  # per admitted instrument; frozen by the D amendment
    notional_usdt_bicousdt: 20.0434  # round one's frozen value
  volatility:
    sigma_ref: {GALAUSDT: 9.68152, JTOUSDT: 13.8661, ALGOUSDT: 9.16192, ZECUSDT: 8.48928, CAKEUSDT: 7.42914, ALICEUSDT: 9.70072}  # D median, per admitted instrument; frozen by the D amendment
    sigma_ref_bicousdt: 7.92472  # round one's frozen value

strategies:
  S0:
    name: touch
    role: reference, fee break-even
    soft_limit_clips: 6.0
  S1:
    name: skew
    role: B1, the base of B2, B3
    search:
      skew_bp: [2, 5, 10]
      k: [0, 0.5, 1, 2]
      min_edge_bp: [0, 1, 2, 4]
      soft_limit_clips: [3, 6, 12]
    cells: 144
    per_instrument: true
    chosen: {GALAUSDT: [5, 0.5, 4, 12], JTOUSDT: [2, 0.5, 4, 12], ALGOUSDT: [2, 0.5, 4, 12], ZECUSDT: [2, 0.5, 0, 6], CAKEUSDT: [2, 1, 4, 12], ALICEUSDT: [2, 0.5, 2, 12]}  # {symbol: [skew_bp, k, min_edge_bp, soft_limit_clips]}; frozen by the D amendment
  S1_touch:
    name: S1 at its touch cell
    k: 0
    min_edge_bp: 0
    skew_bp: the instrument's chosen S1 value
    soft_limit_clips: the instrument's chosen S1 value
    bicousdt: [2, 0, 0, 6]

gate:
  name: room gate
  wraps: S1 or S1_touch
  markout: side x (mid(tau + 5 s) - p) / p x 1e4, every print scored from its resting side  # analysis.market_wide_markouts
  horizon_s: 5
  room: volume-weighted mean markout over the day's prints with t - W <= tau and tau + 5 s <= t, less the maker fee paid
  min_prints_in_window: 20  # fewer, and the gate is closed
  crosses_midnight: false
  defined_from: W minutes after 00:00  # the whole window inside the day; closed before
  hours_mask: per instrument, from D only; hour h in the mask at margin mu if D's volume-weighted markout in h less the maker fee >= mu
  kinds:
    trailing: open when room >= mu
    hours: open when the UTC hour is in the mask at mu
    both: open when both hold
  when_closed: cancel both sides except the side that reduces |position|, which stays at the base's price; nothing when flat
  decision_latency_ms: 10
  reads_the_fee_it_pays: true
  search:
    base: [S1, S1_touch]
    window_min: [15, 60, 240]  # trailing and both only
    margin_bp: [0, 1, 2]
    kind: [trailing, both, hours]
  cells: 42  # 2 bases x (9 trailing + 9 both + 3 hours)
  not_registered: [a gate per side, other windows, other horizons, other margins, a gate on any other quantity]

