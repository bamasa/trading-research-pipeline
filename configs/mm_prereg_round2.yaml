    hours_masks: {0: [], 1: [], 2: []}  # BICOUSDT, {margin_bp: [hours]}; frozen by the D amendment

metrics:
  primary: pooled net per 100 USDT of clip a day
  definitions:
    y_it: net_usd_day_it x 100 / clip_i  # clip_i the frozen clip notional cap
    pooled: mean of y_it over admitted instruments with a usable day t
    paired: difference per instrument-day where both are usable, then pooled the same way
    net_usd_day: spread + adverse + inventory - fees + funding, over a day that starts and ends flat
    making_usd_day: spread + adverse(5 s) - fees
  reported_beside: [pooled USDT sum, net_usd_day, net_bp_turnover, making_usd_day,
                    decomposition, markouts 1/5/30 s by fill path against the market-wide benchmark,
                    fills_per_day, time_quoted, rms_inventory, max_inventory, flattens,
                    max_drawdown, clip_over_touch, gate_open_share]
  significance:
    function: evaluation.significance.assess
    cluster: day
    series: symbol
    deciding_level: day
  minimum_detectable_effect:
    formula: 2 x sigma_D(pooled daily metric) / sqrt(n)
    n: {B1: 13, B2: 13, B3a: 13, B3b: 13, B4: 28}
    sigma_d: {B1: 3.29958, B2: {net: 0.31547, minus_base: 3.22954}, B3a: 3.64583, B3b: 3.21413, B4: {net: 3.04316, minus_base: 7.13847}}  # per primary and per claim; frozen by the D amendment
    value: {B1: 1.83028, B2: {net: 0.174991, minus_base: 1.79142}, B3a: 2.02234, B3b: 1.78288, B4: {net: 1.15021, minus_base: 2.69809}}  # per primary and per claim; frozen by the D amendment

family:
  members: [B1, B2, B3a, B3b, B4]
  test: day-level one-sided t
  correction: holm
  alpha: 0.05
  degrees_of_freedom: {B1: 12, B2: 12, B3a: 12, B3b: 12, B4: 27}
  two_claims: tested at the larger of the two one-sided p-values  # B2, B4

statuses:
  first_read:
    killed: any kill condition fires; needs no significance
    candidate: no kill condition fires and Holm passes across the five
    inconclusive: no kill condition fires and Holm fails
  taken_to_p: candidate on H, or inconclusive on H with every claim positive  # B1, B2, B3a, B3b
  on_p:
    rules: every frozen value; every admitted instrument; every kill condition again; Holm across those taken to P; 27 degrees of freedom
    candidate_then_pass: confirmed
    candidate_then_fail: candidate, not confirmed
    inconclusive_then_pass: candidate, taken to Q
    inconclusive_then_fail: inconclusive
    any_kill: killed on P
  on_q:
    taken: candidate after P (B4 candidate on its P; or B1 to B3b first significant on P)
    pass: confirmed
    kill: killed on Q
    otherwise: candidate
  conditional: B3a or B3b confirmed while B1 is not confirmed; conditional on the fee tier

common_kill_conditions:
  K-pess: a positive verdict under proportional cancellation attribution that is not positive under pessimistic attribution
  K-fund: net minus funding <= 0
  K-dir: making_usd_day <= 0 while net > 0
  K-queue: a positive verdict that is not positive under pessimistic cancellation attribution and all_ahead arrival growth together
  K-nbhd: the primary metric on the held-out block, recomputed with each cell of the chosen cell's D neighbourhood, has a median <= 0
  applied_to: every sign claim of a hypothesis, on every block it is read on

placebo_percentile: 95

hypotheses:
  B1:
    title: a wider spread, at the base fee
    primary: true
    instruments: admitted basket
    block: H
    fee_tier: base
    strategy: S1, each instrument's chosen cell
    statement: S1 earns a positive pooled daily net
    kill_conditions:
      K1: {test: pooled mean daily net over H <= 0, outcome: killed}
      K5: {test: fewer than min_fills passive fills over H, outcome: inconclusive, min_fills: 100}
    common_kill_conditions: [K-pess, K-queue, K-fund, K-dir, K-nbhd]
    placebos: none  # an unconditional quoter has no signal; the controls are the common conditions
    reported_beside: [each instrument with its day t, leave one instrument out, without GALAUSDT and ALGOUSDT, S0 on every instrument]

  B2:
    title: quoting only where there is room
    primary: true
    instruments: admitted basket
    block: H
    fee_tier: base
    strategy: G(base), the chosen gate cell
    comparator: the same base without the gate
    statement: G(base) earns a positive pooled daily net, and more than its base on the same days
    kill_conditions:
      K1: {test: pooled mean daily net of G(base) <= 0, outcome: killed}
      K2: {test: mean paired daily difference G(base) - base <= 0, outcome: killed}
      K3: {test: the true paired difference does not exceed the 95th percentile of the shifted-gate placebos, outcome: killed}
      K4: {test: the volume-weighted market-wide 5 s markout less the maker fee of prints arriving while the gate is open is not greater than of prints arriving while it is closed, pooled, outside each day's first W minutes, outcome: killed}
      K5: {test: fewer than min_fills passive fills over H or the gate open less than min_open_share of quoting time, outcome: inconclusive, min_fills: 100, min_open_share: 0.01}
    common_kill_conditions: [K-pess, K-queue, K-fund, K-dir, K-nbhd]
    placebos:
      shifted_gate:
        description: the open/closed series circularly shifted around the block, the same offset for every instrument in a draw; re-simulated
        count: 50
        seed_first: 0
        seed_last: 49
        offset_h: [6, block length - 6]  # uniform
    reported_beside: [G(base) - S1 when the base is S1_touch, each instrument's gated net and open share, realised room inside and outside open periods, leave one instrument out, without GALAUSDT and ALGOUSDT]

  B3a:
    title: what a professional fee tier changes, 0 bp maker
    primary: true
    instruments: admitted basket
    block: H
    fee_tier: pro1_altcoin
    strategy: chosen on D for this tier from each instrument's S1 and the chosen G(base); every value frozen
    statement: the strategy earns a positive pooled daily net at the tier
    kill_conditions:
      K1: {test: pooled mean daily net over H at the tier <= 0, outcome: killed}
      K5: {test: fewer than min_fills passive fills over H, outcome: inconclusive, min_fills: 100}
    common_kill_conditions: [K-pess, K-queue, K-fund, K-dir, K-nbhd]  # all at the tier
    placebos: none  # a fee is not a signal
    framing: conditional on a professional tier; never reported without the base-fee result beside it
    reported_beside: [the same strategy at the base fee, the same with the taker fee at 5.5 bp]

  B3b:
    title: what a professional fee tier changes, the programme rebate
    primary: true
    instruments: admitted basket
    block: H
    fee_tier: programme
    strategy: chosen on D for this tier, as B3a
    statement: the strategy earns a positive pooled daily net at the tier
    kill_conditions:
      K1: {test: pooled mean daily net over H at the tier <= 0, outcome: killed}
      K5: {test: fewer than min_fills passive fills over H, outcome: inconclusive, min_fills: 100}
    common_kill_conditions: [K-pess, K-queue, K-fund, K-dir, K-nbhd]
    placebos: none
    framing: as B3a; the rebate is "up to" 1 bp, on application, and its taker rate is assumed
    reported_beside: [the same strategy at the base fee, the same with the taker fee at 5.5 bp]

  B4:
    title: the gate on BICOUSDT, on a block no market maker has read
    primary: true
    instruments: [BICOUSDT]
    block: P
    fee_tier: base
    strategy: G(base), base and gate cell chosen on BICOUSDT's D
    comparator: the same base without the gate
    statement: G(base) earns a positive daily net, and more than its base on the same days
    kill_conditions:
      K1: {test: mean daily net over P <= 0, outcome: killed}
      K2: {test: mean paired daily difference <= 0, outcome: killed}
      K3: {test: the true paired difference does not exceed the 95th percentile of the shifted-gate placebos, outcome: killed}
      K4: {test: the room does not persist on P, as B2's K4, outcome: killed}
      K5: {test: fewer than min_fills passive fills over P or the gate open less than min_open_share of quoting time, outcome: inconclusive, min_fills: 100, min_open_share: 0.01}
    common_kill_conditions: [K-pess, K-queue, K-fund, K-dir, K-nbhd]
    placebos:
      shifted_gate: as in B2, offset_h [6, 28 days x 24 - 6]
    confirmation: Q, if candidate on P

measurements:
  block: H for the basket, P for BICOUSDT
  enters_a_verdict: false
  fee_breakeven:
    strategies: [S0, B1's S1, B2's G(base)]
    method: S0 analytically from one run; the others re-run over the grid, the gates reading the fee
    maker_fee_grid_bp: [-1.5, -1.25, -1.0, -0.75, -0.5, -0.25, 0.0, 0.25, 0.5,
                        0.75, 1.0, 1.25, 1.5, 1.75, 2.0]
    taker_bp: 5.5
  robustness:
    strategies: [B1's S1, B2's G(base)]
    design: one axis at a time, the others at the defaults
    axes:
      cancel_attribution: [pessimistic, proportional, optimistic]
      arrival_growth: [none, pro_rata_time, all_ahead]
      latency_ms: [1, 10, 50, 100, 250]
      feed_latency_ms: [0, 20, 50]
  by_hour: [B1's S1 net, market-wide room]  # per instrument
  by_criterion: [A1, A2]

demonstrative_interval:
  is: a hypothesis that ends confirmed, or conditional for B3a and B3b
  reported_with: [every admitted instrument named, strategy and frozen values, fee tier,
                  H net per 100 USDT of clip a day with USDT and bp of turnover, H day t and Holm p,
                  P net with day t and Holm p, Q if read, where it fails, size in USDT at the clips used]
  where_it_fails: [instruments that lost on H or P, the base fee if B3, latency at which net turns non-positive,
                   pessimistic brackets with values, fee break-even, hours that lost, gate open share]
  readme_sentence: "On [instruments], [strategy] at [fee tier] earned [x] USDT per 100 USDT of clip a day ([y] USDT a day at the clips used, [z] bp of turnover) over the held-out fortnight (day t [t], Holm-adjusted p [p]), and [x'] over the four pristine weeks (day t [t'], Holm-adjusted p [p']). It loses [where it fails]."
  cannot_be_one: [a sub-period of H, P or Q, instruments chosen after a held-out read,
                  a cell, window, margin or hour mask other than the frozen ones, a fee tier not registered,
                  a bracket other than the default, a measurement without a hypothesis,
                  inconclusive, candidate not confirmed]
  if_nothing_survives: one sentence, and the fee break-even per instrument

access:
  ledger: experiments/results/mm_round2_ledger.json  # separate from round one's
  granularity: instrument and block
  development: basket D and BICOUSDT D
  first_read: H for the basket with P for BICOUSDT
  second_read: P for the basket, after H's results are committed
  third_read: Q, after P's results are committed
  refuses_unless: [the amendment records this file's sha256, the file on disk has it and is committed, the tree is clean, the block was not read before]
  second_read_of_a_block: stamped second read; cannot change a status
  round_one_access_used: false

compute:
  machine: 10 cores, 32 GB
  workers: 8
  worker_budget_gb: 2.0
  fresh_process_per_job: true
  launch: nohup caffeinate -dimsu uv run python -m experiments.<script> ... > logs/<run>.log 2>&1 &
  if_a_d_worker_exceeds_budget: the held-out run uses 6 workers  # worker count does not change results
  estimates:
    d_configuration_days: 24000
    d_hours: [2, 5]
    first_read_configuration_days: 21000
    first_read_hours: [2, 4]
    basket_p_hours_max: 8
  round_one_rates_s_per_configuration_day: {D: 0.22, H: 0.64}

amendment:
  planned: 1
  when: after the D runs, before the first held-out read
  records: [admission table with each criterion, clip caps, sigma_ref, S1 cells with neighbourhoods and peaks,
            gate cell with neighbourhood, hour masks, B3 strategy per tier with its D values,
            B4 base and gate cell with neighbourhood and hour masks, sigma of the pooled daily metric
            and the minimum detectable effect per primary, compute record, sha256 of this file]
  corrections_before_the_read: a further dated amendment; D re-run in full if a development number could change
  date: 2026-10-04  # frozen by the D amendment
  config_sha256: recorded in the amendment, not in this file
