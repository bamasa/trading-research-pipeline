], peak: [2, 0.5, 1, 12, 8.26354], full_budget_cells: 16}}  # per instrument, the chosen cell and its neighbours with their values; frozen by the D amendment
  gate:
    days: all 25 D days
    instruments: every admitted basket instrument, each on its chosen S1 or S1_touch
    objective: mean over D of the pooled daily metric
    minimum_fills_per_day: 5  # mean over admitted instruments of passive fills a day
    neighbourhood: same base and kind, one step on window_min and margin_bp (margin_bp alone for hours)
    choice: highest neighbourhood median, ties by the cell's own value
    one_cell_for_the_basket: true
