# Market-making study, second round: the machine-readable half of the
# pre-registration.
#
# docs/preregistration/market_making_round2.md is the other half: it says what
# each value means and why it was chosen. The two were committed together on
# 4 October 2026, after round one's held-out results and before any book, print
# or funding file of a basket instrument was fetched. They must agree.
#
# Every value here is fixed now, except those set to null with the comment
# "frozen by the D amendment". Those are chosen on block D by the
# development-period runs and written into this file by the single dated
# amendment, before the first held-out read. The amendment records the sha256
# of this file as it stands after that write; the round-two ledger refuses to
# open a held-out block unless the file on disk matches that hash and is
# committed and clean. Nothing else in this file changes, except under the
# amendment protocol in the document.
#
# Round one's conventions hold: units in the key's suffix (_bp basis points,
# _ms milliseconds, _s seconds, _min minutes, _h hours, _usdt notional), UTC
# dates inclusive, seed ranges inclusive, prices inside the simulator in
# integer ticks. Every simulator setting not listed here is round one's
# (configs/mm_prereg.yaml, section simulator, and its Amendment 1).
#
# No code reads this file yet. The loader arrives with the gate and the
# round-two ledger; until then it is a record, not an input.

name: market_making_round2_preregistration
registered: 2026-10-04
registered_against: "3071de7"  # main when this was written
document: docs/preregistration/market_making_round2.md
venue: bybit
product: linear_perpetual
computed_before_registration: none  # no quote, fill, markout or profit on any basket instrument; no basket book, print or funding fetched

round_one:
  document: docs/preregistration/market_making.md
  config: configs/mm_prereg.yaml
  config_sha256_frozen: ed79d5ff520f5e93e9a8ea142058305117b530041534b1dc115b9e3507379c9d
  ledger: experiments/results/mm_heldout_ledger.json
  outcome_on_h: all four primaries killed
  reused: [simulator, metric definitions, S1 grid, search procedure, BICOUSDT frozen values]

prior_information:
  - round one's results on BICOUSDT, CRVUSDT, XRPUSDT and BTCUSDT over D and H
  - experiments/results/screen_bybit_ranked.csv  # Bybit touch, 2024-02-05..07 and 2024-03-25..27
  - GALAUSDT and ALGOUSDT touch over 2024-02-01..03-10 and 2024-03-12..04-20 (section 27; round one's reversion tape on D and H, mids only)
  - Binance best bid and offer for ALICEUSDT, CAKEUSDT, GALAUSDT, ZECUSDT (2024-02-01..03-09) and ALICEUSDT, CAKEUSDT (2024-03-26..29)
  - BICOUSDT touch over 2024-03-12..04-20 (section 27)
  - HTTP HEAD of every archive of the basket on D, H and P, and of BICOUSDT on P and Q; existence and size only

blocks:
  D:
    role: development
    start: 2024-02-01
    end: 2024-02-25
    days: 25
    instruments: basket candidates, and BICOUSDT for B4
    sets: [admission, clip caps, sigma_ref, S1 cells, gate cell, hour masks,
           B3 strategy per tier, B4 base and gate cell, sigma of daily results,
           minimum detectable effects]
  H:
    role: held_out
    start: 2024-02-26
    end: 2024-03-09
    days: 13
    instruments: admitted basket
    hypotheses: [B1, B2, B3a, B3b]
    reads: 1
    read_with: P for BICOUSDT, as one first read
    read_after: the D amendment is committed
  P:
    role: pristine
    start: 2024-04-08
    end: 2024-05-05
    days: 28
    bicousdt:
      hypotheses: [B4]
      read_with: H for the basket, as one first read
      fetched: stage 1
    basket:
      role: second held-out block for B1, B2, B3a, B3b
      condition: a hypothesis is taken to P (candidate, or inconclusive with every claim positive, on H)
      instruments: every admitted basket instrument
      read_after: H's results are committed
      fetched: stage 2, only if the condition holds
    reads: 1  # per instrument
  Q:
    role: confirmation
    optional: true
    start: 2024-05-06
    end: 2024-06-02
    days: 28
    condition: a hypothesis is candidate after P
    read_after: P's results are committed
    fetched: stage 3, only if the condition holds
    reads: 1
  F:
    role: unused
    start: 2024-03-12
    end: 2024-04-07
    fetched_for_basket: false
  days_independent: true  # every day starts and ends flat; no reader crosses midnight

instruments:
  basket_candidates: [ALICEUSDT, ALGOUSDT, JTOUSDT, ZECUSDT, GALAUSDT, GMTUSDT,
                      CAKEUSDT, IOTAUSDT]
  source_table: experiments/results/screen_bybit_ranked.csv
  implied_spread_bp: {ALICEUSDT: 9.1, ALGOUSDT: 6.2, JTOUSDT: 5.6, ZECUSDT: 4.8, GALAUSDT: 4.6, GMTUSDT: 4.2, CAKEUSDT: 4.1, IOTAUSDT: 4.1}  # February round trip less 12 bp
  added_later: none
  b4_instrument: BICOUSDT
  index_members_read_by_round_one: [GALAUSDT, ALGOUSDT]  # mids only, in the reversion tape on D and H

fetch:
  book_archive: https://quote-saver.bycsi.com/orderbook/linear/{symbol}/{day}_{symbol}_ob500.data.zip
  print_archive: https://public.bybit.com/trading/{symbol}/{symbol}{day}.csv.gz
  funding: bybit public REST, no credentials
  via: data/ensure.py  # only missing days; archives not kept after the replay
  book: {levels: 10, grid_ms: 100}
  stage_1:
    when: after this registration is merged
    what: [D and H for the eight candidates, P for BICOUSDT, funding for both]
    archives_mb: {book: 6537, prints: 1396}  # basket D+H 5,753 and 1,316; BICOUSDT P 784 and 80
    all_days_present: true
  stage_2:
    when: only if a hypothesis is taken to P, after H's results are committed
    what: P for every admitted basket instrument
    archives_mb: {book: 6357, prints: 823}  # all eight candidates
    all_days_present: true
  stage_3:
    when: only if a hypothesis is candidate after P, after P's results are committed
    what: Q for the instruments it covers
    archives_mb_bicousdt: {book: 532, prints: 47}
    all_days_present_bicousdt: true
    basket_checked: false  # checked before any stage-3 fetch
  h_presence_check: file system only  # no H file opened before the ledger permits it

admission:
  computed_on: D
  committed_before: H
  code: market_making/screen.py  # unchanged from round one
  statistics: [tick_bp, spread_bp_time_weighted, share_at_two_ticks_or_more,
               median_touch_over_median_print, prints_per_day,
               market_wide_passive_markout_bp_1s, market_wide_passive_markout_bp_5s,
               market_wide_passive_markout_bp_30s, coverage_D, coverage_H]
  rule: A1 or A2
  A1:
    name: round one's rule
    spread_bp_min: 4.0  # twice the base maker fee
    share_at_two_ticks_or_more_min: 0.25
    prints_per_day_min: 5000
    coverage_min: 0.90  # of D days and of H days, book and prints both present
  A2:
    name: tick-constrained
    tick_bp_min: 4.0  # the spread is then at least 4 bp
    prints_per_day_min: 5000
    coverage_min: 0.90
  if_one_admitted: B1, B2, B3a and B3b run on it alone
  if_none_admitted: the round ends at the amendment; H is not read for the basket; B4 goes on
  if_unexpected: the committed D table wins
  day_exclusions: round one's Amendment 1, items 7 to 10
  max_sequence_gaps: 0  # unless the amendment sets another value from D's counts
