    chosen_neighbourhood: {axes: [base, kind, window_min, margin_bp, value], chosen: [S1, both, 15, 0], median: 0.0738591, own: 0.0738591, cells: [[S1, both, 15, 0, 0.0738591]], peak: [S1, trailing, 15, 2, 0.189404], cells_taking_part: 24}  # cells and values; frozen by the D amendment
    hours_masks: {GALAUSDT: {0: [], 1: [], 2: []}, JTOUSDT: {0: [], 1: [], 2: []}, ALGOUSDT: {0: [], 1: [], 2: []}, ZECUSDT: {0: [13, 14], 1: [], 2: []}, CAKEUSDT: {0: [17, 23], 1: [], 2: []}, ALICEUSDT: {0: [], 1: [], 2: []}}  # {symbol: {margin_bp: [hours]}}; frozen by the D amendment
  b3_choice:
    candidates: [each instrument's chosen S1, the chosen G(base)]
