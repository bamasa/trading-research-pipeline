# Market making on Bybit's BTCUSDT perpetual at the 2021 fees, from prints only.
#
# Registered in docs/preregistration/mm_bybit_2021.md, which this file must
# agree with. Values the study sets on W and D are placeholders, each on one
# line commented "frozen by the D amendment"; nothing else may change. With
# every placeholder put back to null the file hashes to the null-placeholder
# sha256 the document records.

study: mm_bybit_2021
document: docs/preregistration/mm_bybit_2021.md

instrument:
  venue: bybit
  market: linear perpetual, USDT-margined
  symbol: BTCUSDT
  key: bybit-linear:BTCUSDT
  measured_beside: []  # BTCUSD inverse is not computed (the document says why)

data:
  prints_url: https://public.bybit.com/trading/{symbol}/{symbol}{day}.csv.gz
  funding_endpoint: https://api.bybit.com/v5/market/funding/history
  funding_category: linear
  root: data/mm_bybit_2021
  head_check: experiments/results/mm_bybit_2021_head_check.csv

blocks:
  reader_test: [2020-12-15, 2020-12-16]
  W: [2020-12-15, 2020-12-31]
  D: [2021-01-01, 2021-03-31]
  E: [2021-04-01, 2021-04-07]
  H: [2021-04-08, 2021-06-30]
  stress_days: [2021-05-19]
  unreadable_share: 0.25

fees:
  # Maker / taker in bp of notional; negative is a rebate. A day outside every
  # interval is excluded as "fee not sourced".
  intervals:
    - start: 2020-03-22
      end_exclusive: 2022-03-11
      maker_bp: -2.5
      taker_bp: 7.5
      who: every account
      sources: [bybit-help-360039261154-wb-20200410051922, bybit-help-360039261154-wb-20201221, bybit-help-360039261154-wb-20210827, bybit-help-360039261154-wb-20220111, bybit-help-360039261154-wb-20220311223741]
  repricing:
    ex_rebate_maker_bp: 0.0
    negative_control_maker_bp: 7.5
    positive_control_maker_bp: -10.0

settings:
  clip_btc: 0.010
  soft_limit_clips: 6
  latency_ms: 50
  latency_kill_ms: 150
  latency_measured_ms: 10
  grid_ms: 100
  warmup_s: 600
  stop_quoting_at: "23:58"
  flatten_at: "23:59"
  pause_s: 5
  print_gap_exclusion_s: 600
  markout_horizons_s: [1, 5, 30]
  making_horizon_s: 5
  vol_half_life_s: 60
  funding_hours_utc: [0, 8, 16]
  fill_rule: trade_through
  brackets: [touch, delay_one_print]

grid:
  # lambda 0 is S0. A gate is none, or one kind with one parameter.
  lambda: [0.0, 0.5, 1.0, 2.0]
  spread_ticks_at_least: [2, 3, 5]
  vol_at_most_quantile: [0.33, 0.67, 0.9]
  vol_at_least_quantile: [0.33, 0.67, 0.9]
  cells: 40

selection:
  min_fills_per_day: 20
  null_a_draws: 999
  null_b_shift_min: 7
  null_b_shift_margin: 7
  null_b_pattern_seed: 0
  alpha: 0.05

heldout:
  family: [F, S0]
  alpha: 0.05
  t_bar: 3.0
  newey_west_t_bar: 2.0
  newey_west_lag: 5
  min_days: 20
  min_fills: 100
  capacity_cap: 0.10
  placebo_draws: 200
  drift_share: 0.5
  mde_z: 3.84

