# The 2025 short-horizon strategy search, on public data: the machine-readable
# half of the pre-registration.
#
# docs/preregistration/short_horizon_2025.md is the other half: it says what
# each value means and why it was chosen. The two were committed together on
# 8 October 2026, before any 2025 book, print, hourly bar or funding file was
# fetched, and revised together the same day after three reviews (peeking,
# multiplicity, feasibility), then recast from fixed hypotheses into a
# registered strategy search, still before any data was read. They must agree.
#
# The search block below is generic: its schema (clock, cluster, stages, axes,
# catalogue, strata, slots, regime source, nulls, admission, budget) is meant
# to be reused by later registrations with only its values changing.
#
# Every value here is fixed now, except those set to null with the comment
# "frozen by the D amendment". Those are chosen on block D by the
# development-period runs and written into this file by the single dated
# amendment, before block H is read. The amendment records the sha256 of this
# file as it stands after that write; the study's ledger refuses to open a
# held-out block unless the file on disk matches that hash and is committed and
# clean. Nothing else in this file changes, except under the amendment
# protocol in the document.
#
# Conventions of the market-making rounds hold: units in the key's suffix (_bp
# basis points, _ms milliseconds, _s seconds, _h hours, _btc and _usdt sizes),
# UTC dates inclusive, seed ranges inclusive. Slot names (S25, S-C, S-R, S-P,
# S-M, S25-Z) are keys as written in the document.
#
# No code reads this file yet. The loader arrives with the study's ledger;
# until then it is a record, not an input.

name: short_horizon_2025_preregistration
registered: 2026-10-08
registered_against: "af148b5"  # main when this was written
document: docs/preregistration/short_horizon_2025.md
registers: a strategy search (search block below), with the named configuration S25 tested by name
venue: bybit
product: linear_perpetual
instruments: [BTCUSDT, ETHUSDT, XRPUSDT]
computed_before_registration: none  # no 2025 book, print, hourly bar or funding fetched or computed on

prior_information:
  - liquidation cascade of 2025-10-10..11, general market knowledge
  - BTC's 2025 daily price path, in the README's break figure and the daily bars on disk, and general knowledge
  - this repository's kills (sections 25 and 26, maker execution, market-making rounds one and two); the same signal worth +3 to +8 bp crossing and -0.5 to -4.2 bp resting in 2024
  - Bybit fee schedule as published in 2026 (backtest/costs.py, BYBIT_FEE_CAVEAT, whose text names 2024-02..04; parametrised by period, carried here with 2025's dates)
  - HTTP HEAD of every BTCUSDT, ETHUSDT and XRPUSDT book (ob500, ob200) and print archive, 2024-12-01..2025-12-31; existence and size only
  - HTTP HEAD of the BTCUSDT ob200 and ob500 book archives for 2026-01-05..07; ob200 present, ob500 absent
  - "experiments/results/structural_breaks_BTCUSDT*.csv, daily bars 2024-01-01..2026-09-30, public; the README (written 2026-10-02) names its 2025 alarm, 2025-09-13, scale, downward, and a near miss on 2025-06-29; both known when F's span and the hourly detector's setting were set; never defines b"
  - "S25's information set: its coordinates are not claimed to have been chosen without knowledge of market conditions after 2025-08-01; H before that date is reported for every slot as a labelled sensitivity"

expected_outcome:
  taker_bp: {base: 5.5, cheapest_published: 1.5}  # group g1, all three instruments; cheapest is pro6_g1
  taker_round_trip_bp: {base: 11.0, cheapest_published: 3.0}  # a taker pays at the base tier only with a gross edge above 5.5 bp of turnover
  passive_break_even_bp_turnover: {cheapest_published: 0.75, base: 3.75}  # (maker + taker) / 2
  predictions:
    S25: killed by K1 on H
    S25-Z: killed by K1
    S-C: not admitted on D (i)  # signal admission (information) not predicted
    S-R: not admitted on D (i)
    S-P: not admitted on D (i); if it reaches H, killed by K1
    S-M: not admitted on D (i); if it reaches H, killed by K1 or K-dir
    regime_axis: adds nothing beyond random pauses
    R: not tested
    FILL: measurements.FILL.prediction

data:
  book:
    levels: 10
    grid_ms: 100
    rows: "data/bybit.reconstruct at grid_ms 100: at most one row per 100 ms interval, at its first update, stamped with that update's venue time; no row for an interval without an update; no forward fill"
    times: quantities in seconds are measured on row stamps; t + h is the first row stamped at or after t + h
    archives:
      ob500: {url: "https://quote-saver.bycsi.com/orderbook/linear/{symbol}/{day}_{symbol}_ob500.data.zip", present: [2024-12-01, 2025-08-20]}
      ob200: {url: "https://quote-saver.bycsi.com/orderbook/linear/{symbol}/{day}_{symbol}_ob200.data.zip", present: [2025-08-21, 2025-12-31]}
    archive_change: 2025-08-21  # no day has both; the H/F boundary was moved onto it
    ob200_reader_test_days: [2026-01-05, 2026-01-06, 2026-01-07]  # BTCUSDT; the reader is the same code for every instrument; outside every block; used for nothing else but the entry point's dry run; never in a successor's blocks
    ob200_reader_test: synthetic ob200 fixture and the reader-test days pass before H is opened; no ob200 day of 2025 fetched before stage 3
    ob200_reader_test_pass: "as the loader passes a block day: no positive_prices error in validate_book's report, no off-grid price, sequence gaps at most D's max_sequence_gaps; every other finding by check and severity recorded in the amendment beside D's; a failure is a reader fault, corrected by amendment before H"
  prints: {url: "https://public.bybit.com/trading/{symbol}/{symbol}{day}.csv.gz", present: [2024-12-01, 2025-12-31]}
  funding: bybit public REST, no credentials
  detector_bars: {venue: binance, market: futures-um, interval: 1h, from: 2024-12-01, frequency_after_2025_06_30: daily archives only, E_bars: "fetched and read when H opens, bars only"}
  head_check:
    date: 2026-10-08
    days_checked: 396  # every day, 2024-12-01..2025-12-31
    table: experiments/results/short_horizon_2025_head_check.csv
    table_sha256: 86a5719fd92845d111bf846c15fded09409ff084f42679a556c23e113cf4d8e0
    set_from_it: only the H/F boundary; later revisions used only the archive change it found; fetch sizes and the disk budget use its block sums and W's and D's largest and median archive, no searched value
    missing_under_code_pattern: {book_ob500: [2025-08-21, 2025-12-31], prints: none}
    first_and_fifteenth: all prints present; ob500 present to 2025-08-15, absent from 2025-09-01; ob200 present from 2025-09-01
  head_check_eth_xrp:
    date: 2026-10-08
    days_checked: 396  # every day, 2024-12-01..2025-12-31, for each of ETHUSDT and XRPUSDT
    table: experiments/results/short_horizon_2025_head_check_eth_xrp.csv
    table_sha256: 6e294fbed3d259a2eafa96472380cbc52fa64abdc45e686ee3157453e3aa3c9e
    coverage: as BTCUSDT's; ob500 on 263 days to 2025-08-20, ob200 on 133 days from 2025-08-21, no day with both, prints on all 396 days
    set_from_it: no searched value; fetch sizes and the disk budget use its block sums
  local_2025_data: binance daily bars only  # data/bars/BTCUSDT/klines-1d, read by the earlier break run
  exclusions_unit: instrument-day  # unreadability judged per instrument, on the days of the instrument a slot trades
  exclusions: [more book sequence gaps than max_sequence_gaps, "non-positive price (a positive_prices error in validate_book's report; the function does not raise)", "off-grid price (the events.load_day check, R16, applied to every day)", missing plane (HTTP 404 only), missing funding, "flatten_stale (R16): a taker order walked a snapshot more than 5 s older than itself because the book ended", "any day market_making/events.load_day refuses (DayUnavailable, whatever the reason), for every configuration, taker included", unreadable archive (fetch.failures), unfetchable day (fetch.failures)]  # each counted by reason
  flatten_stale_scope: a day flagged in any run on the block (on a held-out block, any run of its read session) is excluded from every series of every slot on that instrument and block and counted once toward unreadability
  max_sequence_gaps_rule: 95th percentile of D's per-day gap counts, rounded up, per instrument; the same value on every block for that instrument
  max_sequence_gaps: null  # {instrument: value}, by the rule above; frozen by the D amendment
  unreadable_block: more than a quarter of a held-out block's days excluded; reported unreadable, nothing retuned, no status changes on it (statuses.unreadable)
  gap_days_included_reported: true  # each verdict also with the gap-excluded days put back, as a measurement
  excluded_days_D: null  # {instrument: [day, reason]}; frozen by the D amendment
  instrument_spec: null  # {instrument: {tick, lot}} from the venue's instrument specification; frozen by the D amendment

blocks:
  W: {role: warm_up, start: 2024-12-01, end: 2024-12-31, days: 31, archive: ob500, scored: false, reads: free}
  D: {role: development, start: 2025-01-01, end: 2025-06-30, days: 181, archive: ob500, reads: free}
  O: {role: descriptive_window_inside_D, start: 2025-02-04, end: 2025-02-26, days: 23, archive: ob500, use: [A0, FILL]}
  E: {role: embargo, start: 2025-07-01, end: 2025-07-07, days: 7, archive: ob500, book_prints_funding_fetched: false, hourly_bars: "read by the detector only, opened with H"}
  H: {role: held_out, start: 2025-07-08, end: 2025-08-20, days: 44, archive: ob500, slots: [S25, S-C, S-R, S-P, S-M, S25-Z], reads: 1, read_after: the D amendment is committed}
  F: {role: boundary, start: 2025-08-21, end: 2025-11-16, days: 88, archive: ob200, reads: 1, read_after: H's results are committed, read_always: true}
  P: {role: after, start: 2025-11-17, end: 2025-12-31, days: 45, archive: ob200, reads: 1, read_after: F's results are committed, condition: "a slot (S25-Z included) passed on F"}
  moved_by_head_check: {H_end: {planned: 2025-09-21, registered: 2025-08-20}, F_start: {planned: 2025-09-22, registered: 2025-08-21}}
  days_independent: true  # flat at every midnight; rolling statistics read earlier days of the same block, and W before D and F before P; H and F start cold
  cold_start_days: [2025-07-08, 2025-08-21]  # rolling state rebuilt from the block's own rows
  cold_start_unscored: the first N minutes from each cold-start day's midnight, whatever days they span, N being features.longest_lookback_minutes
  spent: H, F and P are spent for every configuration of this catalogue on the three instruments; successors use blocks after 2025-12-31

common:
  clip_btc: 0.010  # BTCUSDT, for every configuration and every execution path; no Kelly sizing
  clip_other_instruments: "0.010 x (BTC's mean mid on W) / (the coin's mean mid on W), rounded down to the lot step; written to the fitted-values file (features.fitted_values_sha256)"
  report_per_100_usdt_of_clip: true
  max_position_clips: 1
  latency_ms: 10  # simulator rule R3
  taker_fill:
    executor: event-time taker executor (new code); pipeline/execution.run_taker not used
    entry: walk the first snapshot at or after decision + 10 ms across 10 levels, VWAP for the clip
    slippage_bp_on_top_of_walk: 0
    entry_skip: {clip_exceeds_visible_depth: true}  # entry only; skipped and counted; no skip by snapshot age
    entry_late_snapshot: an entry whose walked snapshot is stamped more than 1 s after the order arrives is counted and reported; no day excluded
    exit: "walk the first snapshot at or after decision + 10 ms whatever its age; depth beyond level 10 at the tenth level's price, counted (flatten_beyond_visible_book); a walked snapshot stamped more than 1 s after the order arrives is counted and reported (exit_late_snapshot), every taker exit including the passive slots', no day excluded"
    exit_after_book_end: walk the last snapshot; if it is more than 5 s older than the order, the day is flagged flatten_stale and excluded (R16)
    funding: R14
    accounting_identity: R15, turnover equal to the sum of fill notionals
    same_walk_function_as_label: true
  passive_fill:
    simulator: market_making/simulator.py
    rules: [R5, R6, R7]
    clip_btc: common.clip_btc, or the instrument's clip  # new setting; replaces clip_notional and clip_touch_share
    queue_priority: tail
    cancel_attribution: proportional
    arrival_growth: pro_rata_time
    crossed_policy: trade_tape
    post_only: true
    order_latency_ms: 10
    cancel_latency_ms: 10
    feed_latency_ms: 0
    soft_limit_clips: 1
    max_sequence_gaps: data.max_sequence_gaps (the frozen value for the instrument)  # SimConfig's default of 0 not used
    warmup_s: 60
    stop_quoting_at: "23:58"
    flatten_at: "23:59"
    markout_horizons_s: [1, 5, 10, 30]
    decomposition_horizon_s: 5
    suspend_after_pause_s: 5  # no snapshot for 5 s pulls every resting order until the next one; also R16's flatten_stale threshold
    vol_half_life_s: 60  # simulator default; not used by the signal-entry quoter
    touch_window_s: 3600  # simulator default; not used by the signal-entry quoter
    quoter: "signal-entry quoter (new code): one clip at the touch on the signal's side at decision + 10 ms, kept at its first price, never re-pegged, cancelled unfilled after hold"
    quoter_after_pause: an entry pulled by a pause is not re-posted; its unfilled part counts as unfilled, and a part filled before the pause is exited as any fill
    exit: reduce-only cross hold after the fill, priced by the taker executor's walk, with its late-snapshot counters
    flatten_slippage_bp: 0
    signal_timing: "the decision reaches the quoter as a tape row stamped at the decision row's stamp t; under the strictly-before rule it is first seen by the event after t and the order is live no earlier than t + 10 ms; unit test: no event at or before t sees it, every post live at or after t + 10 ms"
    regime_guard: a resting entry is cancelled at the first event after a flag inside its window
    not_used: round one's SignalExecutor (X1)
  market_maker:
    strategy: S1 with the signal lean (pipeline/market_making, lean > 0)
    S1: {skew_bp: 2, k: 0.5, min_edge_bp: 4}  # round one's frozen values, configs/mm_prereg.yaml
    soft_limit_clips: 1
    lean: [0.5, 1, 2]  # the slot's neighbourhood; the cell is 1
    lean_window_s: the signal's hold
    lean_tape: "pipeline/market_making.signal_tapes on the signal's accepted entry decisions; signed strength in bp: mu for a regressor, and for a classifier the side times the median absolute forward move over the hold on the fold's training rows"
    guard: {slot: guard_pull at the signal's regime window (none when it has none), measured: [guard_pull and guard_widen at 4, 24 and 120 h with lean 1], guard_window_min: 60 x the window in hours}
    simulator_settings: passive_fill
  fees:
    verdict_tier: {name: base, maker_bp: 2.0, taker_bp: 5.5}  # BYBIT_BASE
    measurement_tiers: BYBIT_LINEAR_TIERS rows for group g1 (all three instruments), and BYBIT_MM_PROGRAMME_MAKER_BP  # with BYBIT_FEE_CAVEAT, parametrised by period, carrying 2025's dates
    zero_fee: {maker_bp: 0.0, taker_bp: 0.0, used_by: [A0, S25-Z]}  # a 0 bp label fee is a searched label value, not a verdict fee
  funding: charged at each settlement on the position held (R14)
  day: {no_entry_before: "00:01", no_entry_after: "23:58", flatten_at: "23:59"}
  accounting_identity: R15, checked at every day's end

labels:
  per_instrument: true  # every label, feature and model is built per instrument
  walked_taker:
    stratum: C
    clip: the traded clip  # equals the traded clip on each instrument
    horizon: hold  # the label declares h; the purge is derived from it
    entry_snapshot: first at or after t + 10 ms
    exit_snapshot: first at or after the entry snapshot + hold
    normalised_by: the entry snapshot's mid
    classes: [long, hold, short]  # long if long P&L > 0, short if short P&L > 0, else hold
    label_fee_bp: [0, 5.5]  # a searched axis (search.axes.label_fee_bp), charged on both sides; S25 and A0 at 0
  forward_move: {stratum: R, definition: mid at the exit snapshot over mid at the entry snapshot minus 1 in bp (a simple return), smoothing: 1, form: time-based (new code; forward_smoothed_move_bp not used)}
  control: {form: "time-based smoothed_move_bp (new code): log of the mean mid over the 20 rows ending at the first row stamped at or after t + hold, over the mean mid over the 20 rows ending at t, x 1e4", smoothing_rows: 20, horizon: hold, horizon_measured_on: row stamps, used_by: "the K-label control networks, at the frozen fits only, on R*'s instrument and the holds of R*'s neighbourhood, when R*'s model is tcn"}

features:
  microstructure_set: registry book, depth and flow features over ten levels, plus the 2025 set added by the features pull request
  added_2025: [volatility_1s, return_sign_autocorrelation, turn_count, run_length, inter_trade_time, level0_lag_logs]
  winsorising: {quantiles: [0.001, 0.999], window_s: 3600, on: each feature's own trailing values on row stamps}  # never whole-day quantiles
  tensor: {columns: 40, levels: 10, price: "distance from the touch over max(sigma x mid, spread floor)", sigma: std of the mid's row-to-row log changes over the trailing 60 s on row stamps, spread_floor: the instrument's median quoted spread on W, size: "log(1 + size) z-scored against its mean and std on W"}  # W's values in the fitted-values file
  leakage_check: "validation/leakage.py, every feature, before any D run; depth and flow builders wrapped as registered features with declared lookbacks (covered by the purge and N); for trade-plane features the prints cut at a time strictly inside a row interval, and streaming parity compared at each decision stamp"
  print_alignment: "backward: a print belongs to the first row stamped at or after it, row t holds prints in (s_t-1, s_t] (side=left, as features/align.py); features/flow.align_to_grid as it stands not used"
  gate_inputs: basis points from prices only
  lookbacks: "declared in seconds on row stamps, except the network's 64-row window and the control label's 20-row smoothing; N = the longest lookback in seconds, rounded up to whole minutes; on a cold-start day a row is also unscored until the row-declared windows have their rows since midnight"
  selection: {code: features/selection.py, runs: once per instrument, window: the instrument's 2025-01-01..2025-01-31, rows: every tenth row (at most 2.68 million), target: walked_taker at 0 bp, hold_s: 20, forward: forward_move at hold_s 20, selector: {class: FeatureSelector, settings: defaults, score_target: ic, max_features: 40, correlation_threshold: 0.95, variance_threshold: 1.0e-6}, name: micro-selected}
  stores: {dtype: float16, every_tenth_row: every instrument, every_row: "the network's inputs, one instrument at a time; two never coexist", format: one zstd parquet per instrument-day, parity_tests_at: float16}  # labels, costs, gate inputs, walk tables and fills from the book's float64 prices
  selected: null  # {instrument: [features]}; frozen by the D amendment
  longest_lookback_minutes: null  # N for the cold-start days; frozen by the D amendment
  fitted_values: every fitted value that is not a weight (W's size floors and normalisers, the tensor's floors, each instrument's clip, any other fitted constant), in one file; used on every block, never refitted at a read
  fitted_values_sha256: null  # the sha256 of that file; checked by the H, F and P gates beside the weights; frozen by the D amendment

models:
  hyperparameters: repository defaults; one registered seed per fit; none searched
  gbm: {code: models/gbm.py, classes: 3, stratum: C, missing_class_in_fit: that side's probability is 0 (_align_columns) and it never trades with that model; reported, cores: all (n_jobs -1), one fit at a time}
  logistic: {code: models/linear.py LogisticBaseline, classes: 3, stratum: C, missing_class_in_fit: as gbm}
  tcn: {code: models/tcn.py, stratum: R, window_rows: 64, channels: 32, levels: 4, kernel_size: 3, dropout: 0.1, max_epochs: 20, head: [mu, log_variance], loss: "gaussian_nll + 0.01 x mean((log_variance - log v)^2), v the variance of the fold's training targets", log_variance_clamp: log v +- 6, early_stopping: {patience_epochs: 3, on: rank IC of mu against the realised forward move on the inner validation}, checkpoint: the same rank IC, internal_validation_split: not used, device: mps, one fit at a time}
  bound_ridge: {code: "models/uncertainty.py HeteroscedasticRegressor (pipeline/stages.py UNCERTAIN bound_ridge: ridge, ridge)", settings: defaults, stratum: R, mu: the mean model, sigma: the square root of the variance model}
  control_network: same as tcn, trained on the control label
  windows: {rows: the 64 consecutive 100 ms rows ending at the decision row, same_in_training_and_inference: true, dataset: "lazy, built per batch, streamed per day from the every-row store (new code)", inference: batched}
  training_rows: {targets_every_nth_row: 10, max_rows_per_fit: 4000000, sampling: evenly in time}
  frozen: {train: 2025-01-01..2025-06-23, thresholds_and_checkpoints: 2025-06-24..2025-06-30, fits: "every hold and label fee in the neighbourhood of C*, R* (admitted or not) and S25", max_fits: {gbm_and_logistic: 16, tcn: 4, control: 4}}
  weights_sha256: null  # {fit key: sha256} for every frozen fit; the only place they are written; frozen by the D amendment
  checkpoint_epoch: null  # {fit key: epoch} for the frozen network and control fits; the only place they are written; frozen by the D amendment

search:
  clock: {rows: data.book.rows (100 ms), decisions: every row}
  cluster: day  # the unit of every daily series, null and Newey-West lag
  instruments: [BTCUSDT, ETHUSDT, XRPUSDT]
  blocks: {sandbox: [W, each instrument's January], scored: "D's walk-forward test days, 2025-02..06 (150)", held_out: [H, F, P]}
  stages:
    - {stage: 0, before: any 2025 fetch, what: "catalogue hash check; the code timed on 2024 days on disk (BTCUSDT 2024-02-11 and 2024-03-05, one XRPUSDT day of 2024); D's wall time projected; cuts by budget.reduction_order if over budget.ceiling_days"}
    - {stage: 1, what: "fetch, replay and features for W and D, one instrument at a time; leakage, fold-level leakage and flag-causality tests; selection per instrument on its January"}
    - {stage: A, what: "600 walk-forward fits; predictions on the test days; candidate-row tapes per signal configuration and test day; daily IC on all decision rows"}
    - {stage: B, what: "every taker cell on every test day from walk tables; one trial-ledger row per cell-day"}
    - {stage: D, what: "the choice, admission and the placebo search, with the refit replication"}
    - {stage: C, what: "the simulator: S25-Z, S-P and S-M; A0 and FILL on O"}
    - {stage: E, what: "frozen fits; sigma_D and the MDEs; the detector's alarm rate on D; the dry run; the amendment"}
  axes:
    instrument: {values: [BTCUSDT, ETHUSDT, XRPUSDT], kind: categorical, stage: A, code: "data/bybit.py, data/bybit_trades.py; per-instrument loader and clip", new: true}
    stratum: {values: [C, R], kind: slot, C: three-class classifier with the hold-first rule, R: Gaussian regressor with the EV gate}
    model: {values: {C: [gbm, logistic], R: [tcn, bound_ridge]}, kind: categorical, stage: A, code: [models/gbm.py, models/linear.py, models/tcn.py with the Gaussian head (new), models/uncertainty.py]}
    label: {values: {C: walked_taker, R: forward_move}, kind: fixed by stratum, new: true}
    label_fee_bp: {values: [0, 5.5], kind: ordered, stratum: C, stage: A}
    inputs: {values: {C: [micro, micro+tensor], R: {tcn: tensor+micro, bound_ridge: micro}}, kind: categorical in C; fixed by the model in R, stage: A, micro: features.selection (micro-selected)}
    hold_s: {values: [5, 20, 50, 120], kind: ordered, stage: A, measured_on: row stamps, equals: the label horizon}
    trades_per_day: {values: [25, 50, 100, 240], kind: ordered, stratum: C, stage: B, sets: per-side theta of the hold-first rule on the inner validation}
    k: {values: [0, 0.5, 1], kind: ordered, stratum: R, stage: B}
    beta_bp: {values: [0, 1, 2], kind: ordered, stratum: R, stage: B}
    gate: {values: [open, quiet_out, tight_only], kind: categorical, stage: B, code: "backtest/gating.py MarketGate, as experiments/grand_search.gate_for", quiet_out: "the mid's realised volatility over the trailing 60 s, in bp, at or above the 30th percentile of the fold's training rows", tight_only: "the quoted spread in bp at or below the 70th percentile of the fold's training rows"}
    regime: {values: [none, pull_4h, pull_24h, pull_120h], kind: ordered by window (none is 0), stage: B, applies_to: [taker, passive_entry], code: "pipeline/execution.guarded_rows; pairs in pipeline/execution.VALID_PAIRS only"}
    execution: {values: {taker: [S25, S-C, S-R], signal_entry_quoter: [S-P, S25-Z], s1_with_lean: [S-M]}, kind: slot, chosen: never}
    exit: {value: close by time at hold_s, kind: fixed, measured_only: passive exit at the touch, crossed after a further hold (S-P, S25-Z)}
    measured_never_chosen: [fee tier, "fill rule (on_touch, trade_through, queue)", "queue brackets (none, all_ahead, pessimistic)", latency 110 ms]
  validity: "C: every combination of instrument, model, inputs, gate, hold_s, trades_per_day, label_fee_bp and regime; R: every combination of instrument, model (inputs fixed by the model), gate, hold_s, k, beta_bp and regime"
  fixed_not_searched: [hyperparameters and seeds (defaults, one seed per fit), cooldown 0 beyond the one-position rule, monthly walk-forward cadence, normaliser window, "feature selection (once per instrument, at most 40)", sizing (one clip), holds of 300 s and longer, exits other than the clock, "flag source (BTC's hourly monitor for every instrument)"]
  catalogue:
    key_C: "<instrument>|C|<model>|<inputs>|<gate>|hold_s=<h>|trades_per_day=<n>|label_fee_bp=<f>|regime=<r>"
    key_R: "<instrument>|R|<model>|<inputs>|<gate>|hold_s=<h>|k=<k>|beta_bp=<b>|regime=<r>"
    numbers_written_as: [0, 0.5, 1, 2, 5, 5.5, 20, 25, 50, 100, 120, 240]
    serialisation: keys sorted in byte order, each followed by a newline, UTF-8
    groups: 54  # C 12 and R 6 per instrument
    taker_cells: 7200  # C 1,536 and R 864 per instrument
    signal_configurations: 120  # C model x inputs x hold x label fee (32) and R model x hold (8), per instrument
    walk_forward_fits: 600
    sha256: 45a32e8ada0401a4f4d225ba5c96197d5833927409b1db0a92e9fc8142aac4b5
    entry_point: checks the sha256 before stage 1 and refuses any key outside the catalogue
  named:
    S25: "BTCUSDT|C|gbm|micro|open|hold_s=50|trades_per_day=240|label_fee_bp=0|regime=none"
  strata:
    C: {models: [gbm, logistic], label: walked_taker, decision: hold_first, ordered_axes: [hold_s, trades_per_day, label_fee_bp, regime], slot: S-C}
    R: {models: [tcn, bound_ridge], label: forward_move, decision: ev_gate, ordered_axes: [hold_s, k, beta_bp, regime], slot: S-R}
  slots: [S25, S-C, S-R, S-P, S-M]  # k = 5, fixed now; see the slots block
  regime_source:
    detector: the detector block (BTC's hourly flags guard every instrument)
    flags_on_D: "fold-wise: for test month m, the hour profile fitted on the hours from 2024-12-01 to the last hour before m; one detect_breaks call from 2024-12-01 to m's last hour; the guard uses its alarms in [m's start - 120 h, m's end]"
    flags_on_H_F_P: the frozen detector, its profile fitted on all of D; also in the dry run
    windows_h: [4, 24, 120]  # 120 h is the monitor's re-arm time (min_history 121 h)
    flag_causality_test: "on the pattern of validation/leakage.py: mutating every bar after hour t leaves every flag at or before t unchanged, in every fold; failure is K-flag-leak"
    attribution: {statistic: the slot's mean minus its window-0 twin's, reference: 95th percentile of the same difference under random flag sets, sets: {taker: 200, simulator: 20}, seeds: [0, 199], flags_per_set: as many as the block has, at hours drawn uniformly over its usable hours, kill: false}
  choice:
    per: stratum, across every group on all three instruments
    S: "median over the cell's neighbourhood of each cell's mean daily net_bp_trade at the base tier over the 150 test days"
    neighbourhood: "validation/search.neighbourhood_scores' block over the stratum's ordered axes, every cell within one step, diagonals included, at the cell's categorical values; every cell counted whatever its trade rate; a cell without a trade on D scores 0, written by the entry point"
    vectorised: tested equal to neighbourhood_scores on small grids
    min_trades_per_day: 5  # limits which cell may be chosen, not which cells are neighbours
    rule: highest S among admissible cells; ties by the cell's own mean
    report_peak: true
    no_admissible_cell: "not run (no admissible cell on D); p = 1; the filter is not relaxed"
  admission:
    signal:  # C* and R*; both must hold
      iii_carry_forward: "for each m in 2025-03..06, the choice re-run on the test months before m and the new cell's G scored on m's days after a 5-day embargo; mean over the four months > 0 (also computed for net: the D estimate used for power on H)"
      iv_placebo_search: max(p_A, p_B) <= 0.05
    slot:  # failing slots are "not admitted on D (<condition>)", p = 1 on every block
      S-C: [signal admitted, "i: the chosen cell's S > 0", "ii: the neighbourhood median of monthly mean net > 0 in at least 4 of the 5 test months"]
      S-R: [signal admitted, i, ii]
      S-P: "signal: the admitted C* or R* (both admitted: the larger carry-forward G, C* on a tie; neither: S25's); cells: the signal's hold x trades_per_day x label_fee_bp (or hold x k x beta_bp) at its categorical and regime values, each simulated on the 150 days; admitted on i and ii on net_per_100_clip_day"
      S-M: "S1 with the lean on S-P's signal; cell lean 1, neighbourhood lean 0.5, 1, 2; admitted on i and ii on net_per_100_clip_day and spread capture > 0 on D"
      same_as_S25: a searched slot whose chosen cell is S25's is "same as S25", p = 1
    no_search_null_for: [S25, S-P, S-M]  # fixed, or no choice on a passive outcome
  nulls:
    statistic: "A = median over the chosen cell's neighbourhood of each cell's day-level t of G (0 for a cell without trades); G = net - (L + S) / 2 per trade"
    max_over: strata
    rerun: [per-cell daily series, the 5-trade filter, neighbourhood medians, the choice in and across groups and instruments, the admission statistic]
    not_rerun: [fits, theta, checkpoints, feature selection, gate levels, guard flags]  # none reads a test day's outcome (fold-level leakage and flag-causality tests)
    null_A: {unit: UTC hour of the usable test days, draws: 999, seeds: [0, 998], rng: "numpy.random.default_rng(b)", shared_by: every configuration and instrument in the hour, flipped_trade: the stored walk of the opposite side, funding included}
    null_B: {unit: day, shifts: "every s with 7 <= s <= n - 7 on the circular order of usable test days (137 at n = 150)", same_s_for_every_instrument: true, executes: the source day's accepted entries (time of day and side, after its own guard) on the target day's walk tables, busy_entry: skipped and counted, parity_test: "at s = 0 the walk-table route equals the executor, on the dry run", fallback: "19 shifts at multiples of 7 days, by a dated amendment before D is scored"}
    p_value: "(1 + #{replications with max over strata of A >= A_j}) / (1 + replications)"
    bar: max(p_A, p_B) <= 0.05  # market_making/verdicts.exceeds_placebos on the distribution of the maximum
    refit: {mandatory: true, replications: 1, what: "every fold's training labels circularly shifted by 28 days within its training span; every gbm and logistic fit redone; stratum C's selection re-run", rule: "if its A exceeds Null B's 95th percentile, C's bar becomes that A", not_refitted: [tcn, bound_ridge]}
    diagnostic_only: global sign flip
    S25_against: Null A and Null B applied to its fixed cell, no selection
  reported_not_gating: [N_trials, "N_eff = effective_count(N_trials, mean_pairwise_correlation(daily G panel))", deflated Sharpe ratio of daily G and net per finalist, "selection premium (median null maximum of A, and A minus it)", "PBO by CSCV per stratum (10 blocks of 15 days, 252 splits)", MDE and power at t >= 3 for the carry-forward estimate]  # every D number labelled "selected, biased upward"
  trial_bound: {N_max: 7255, parts: {taker_cells: 7200, S25-Z: 12, S-P: 30, S-M: 9, A0_and_FILL: 4}}
  trial_ledger: {file: experiments/results/short_horizon_2025_trials.csv, row: one per configuration per day, columns: [key, catalogue_sha256, commit, net, G, L, S, trades, skips], committed: at the end of each stage, hand_runs_on_test_days: count as trials and join the catalogue and both nulls before the amendment}
  entry_point: {file: experiments/short_horizon_2025.py, committed: before any test day of 2025-02..06 is scored, every_test_day_score_from_it: true}
  budget: {ceiling_days_D: 6, projected_D_hours: [68, 126], reduction_order: [tcn on ETHUSDT and XRPUSDT, XRPUSDT entirely, hold_s 120, C's micro+tensor inputs, quiet_out gate], cuts_by: a dated amendment with the new catalogue sha256 and N_max, committed before stage 1, after_a_2025_file_on_disk: nothing cut; a slower run only takes longer}
  result_trials: null  # {N_trials, N_eff, trial ledger sha256 and row count}; frozen by the D amendment
  result_choice: null  # {C*: cell, S, neighbourhood with D values, peak; R*: the same}; frozen by the D amendment
  result_admission: null  # per slot: decision and reason, carry-forward G and net, PBO, DSR, selection premium; S-P's signal; frozen by the D amendment
  result_nulls: null  # nulls file sha256; per stratum A, p_A, p_B, the quantiles and the refit A; frozen by the D amendment

d_procedure:
  stages: search.stages
  walk_forward:
    test_months: [2025-02, 2025-03, 2025-04, 2025-05, 2025-06]  # 150 test days
    train: D days before the test month, except the last seven
    inner_validation_days: 7  # per-side theta from the target rate (reads no outcome) and the network's checkpoint by inner rank IC
    purge: hold plus the longest feature lookback, before the inner validation and before the test month  # experiments/grand_search.py's purge not used
    fold_level_leakage_test: mutating every label and price after fold m's training cutoff leaves fold m's weights, theta, gate levels and checkpoint unchanged (sha256); the precondition for nulls without refitting
  candidate_tapes: "per signal configuration and test day, the rows at which the loosest cell could enter (theta at 240 a day; k 0 and beta 0; gate open; no guard), with scores, gate and guard states; at most 10 GB"
  walk_tables: "per instrument-day and hold, the long and short walked P&L at every 100 ms row from the taker executor's walk (10 ms latency, funding included); built in memory one day at a time, never stored"
  thinning: one position at a time, an event-jump loop over the cell's subset of the tape
  choice: search.choice
  admission: search.admission
  frozen_fit:
    train: 2025-01-01..2025-06-23
    purge: hold plus the longest feature lookback before 2025-06-24
    inner_validation: 2025-06-24..2025-06-30
    fits: models.frozen
    thresholds: every (hold, trades_per_day, label_fee_bp) cell of each frozen C neighbourhood (C*'s and S25's)
    covers_every_neighbourhood: true  # K-nbhd on a held-out block runs only frozen files
  dry_run: "the entry point end to end before the amendment, on D's last 44 days (2025-05-18..06-30) for H and the three ob200 reader-test days for F and P, with the walk-table parity test; outputs discarded, never reported"

slots:
  S25:
    key: search.named.S25
    instrument: BTCUSDT
    stratum: C
    model: gbm
    inputs: micro
    label: walked_taker at label_fee_bp 0
    hold_s: 50
    rule: hold_first
    trades_per_day: 240
    gate: open
    regime: none
    execution: taker in, taker out after hold
    clip_btc: 0.010
    verdict: net_bp_trade at the base tier (5.5 bp taker), funding included
    fixed_before_D: true  # no admission, no search-level null; to H whatever D shows
    neighbourhood: {hold_s: [20, 50, 120], trades_per_day: [100, 240], label_fee_bp: [0, 5.5], regime: [none, pull_4h]}  # 24 cells; one frozen fit per hold and label fee (6)
    fallback_signal_for: [S-P, S-M]
    leaderboard: badge and rank r of N
    thresholds: null  # {(hold_s, trades_per_day, label_fee_bp): {theta_long, theta_short}} for its neighbourhood; frozen by the D amendment
  S-C:
    from: search.result_choice C*
    admission: search.admission.slot.S-C
    execution: taker in, taker out after hold
    thresholds: null  # {(hold_s, trades_per_day, label_fee_bp): {theta_long, theta_short}} for C*'s neighbourhood; frozen by the D amendment
  S-R:
    from: search.result_choice R*
    gate: "mu - k*sigma > 2*5.5 + walk_cost_bp + beta_bp, mirrored for shorts"  # beta is the buffer, not the break date b
    one_entry_per_event: true
    sizing: one full clip a trade; no Kelly sizing (strategies/sizing.py FractionalKelly not used)
    admission: search.admission.slot.S-R
    execution: taker in, taker out after hold
  S-P:
    signal: search.admission.slot.S-P  # the admitted C* or R*, else S25's
    execution: "signal-entry quoter: one clip at the touch on the signal's side, kept at its first price, waits at most hold; taker out hold after the fill"
    variant_measured: passive exit at the touch, crossed after a further hold
    fee: base
  S-M:
    signal: S-P's
    execution: common.market_maker
    fee: base
  S25-Z:
    signal: S25's
    execution: as S-P, under the queue fill rule
    fee: zero_fee
    neighbourhood: {hold_s: [20, 50, 120], trades_per_day: [100, 240], label_fee_bp: [0, 5.5]}  # 12 cells
    family: none  # statuses.S25-Z
  A0:
    signal: S25's
    protocol: {train: 2025-01-01..2025-01-27, thresholds_on: 2025-01-28..2025-02-03, trades_per_day: 240, hold_s: 50, run_on: O}
    executions: [taker at zero_fee, passive under each FILL rule]
  regions:  # leaderboard measurements, no slot
    T1: {stratum: C, model: gbm, inputs: micro, label_fee_bp: 5.5, gate: open, regime: none}
    T2: {stratum: R, model: tcn, gate: open, regime: none}
  one_position: "until the previous position is closed and no entry order is resting: a taker the hold; the quoter the wait of at most hold for a fill, then the time to the exit"

metrics:
  primary: {S25: net_bp_trade, S-C: net_bp_trade, S-R: net_bp_trade, S-P: net_per_100_clip_day, S-M: net_per_100_clip_day, S25-Z: gross_bp_trade and net at 0/0}
  choice_on_D: net_bp_trade at the base tier  # search.choice
  admission_on_D: G  # search.nulls.statistic; per trade net minus the mean of the long and short walked P&L over the same entry and hold; a day's value is the mean over its trades
  day_series:
    taker: one value per day with a trade; the day's net USDT summed over round trips / their summed entry notional x 1e4  # S25, S-C, S-R
    S25-Z: one value per day with a trade; the day's gross USDT summed over round trips / their summed entry notional x 1e4; and the same for net at 0/0
    passive: every usable day; the day's net USDT x 100 / the clip's notional at each entry, summed; 0 for a day without a fill, written as a row into the table given to assess  # S-P, S-M
  computed_on_day_series: [mean, t, newey_west_t, median_day, K1, K-days, placebos, K-nbhd, sigma_d, mde]  # never on trade rows
  ic: rank correlation of the score (p_long - p_short, or mu) with the mid move from the entry snapshot to the first snapshot at or after it + hold, per day over all decision rows, mean over days
  beside: [gross_bp_turnover, ic, fill_ratio, markouts_1_5_10_30s_by_path, spread_plus_adverse_5s, trades_per_day,
           share_days_positive, median_day, max_drawdown, net_usdt_day, funding, every_published_tier, by_side, newey_west_t,
           entries_skipped, entry_late_snapshot, exit_late_snapshot, flatten_beyond_visible_book, regime_attribution]
  significance: {code: evaluation/significance.py assess, input: one row per day, cluster: day, series: none, decides: day level, fewer_than_two_days: not given to assess; fails the day count; p = 1}  # series=None, one series
  p_value: market_making/verdicts.day_t(daily series).p_one_sided  # Student t at days - 1 through verdicts.t_sf; Holm is verdicts.holm, placebos verdicts.exceeds_placebos
  degrees_of_freedom: days in the daily series minus one, per slot and per block
  newey_west: {kernel: bartlett, lag_days: 5, code: evaluation/significance.py (new)}
  all_calendar_days_scored: true  # no row filtered or reweighted by label, outcome or model state
  mde:
    formula: (3 + 0.84) * sigma_D / sqrt(n_eff)
    n_eff: 44 x the share of D's 150 test days with a trade at the chosen cell; 44 for S-P and S-M
    n_eff_on_F_and_P: the usable days of the series the status is assessed on (F- or all of F, or P) x the same share; sigma_D as frozen
    searched_slots_also: sigma_D at the carry-forward estimate, with the power of the t >= 3 bar against it
    sigma_d: null  # per slot and S25-Z, over D's 150 walk-forward test days; frozen by the D amendment
    value: null  # per slot and S25-Z; frozen by the D amendment

family: [S25, S-C, S-R, S-P, S-M]
statuses:
  holm: {alpha: 0.05, sided: one, across: family, m: 5, m_fixed_on_every_block: "true (H, F- or all of F, P, each of R's split days)", code: market_making/verdicts.holm, enter_with_p_1: [killed, void, inconclusive under K-trades, "not run (no admissible cell on D)", "not admitted on D (<condition>)", same as S25, not taken to the block, "scored on P only by its mean (R supported)"], degrees_of_freedom: days in the daily series minus one}
  holm_first_step_t: {df_43: 2.42, df_19: 2.54, df_9: 2.82}  # below 3: the t >= 3 bar binds on every block
  no_deflation_on_H: true  # H untouched by the search; D's trials act only on D through the nulls, DSR and PBO
  bar: [no kill, Holm passes with m = 5, day t >= 3, Newey-West t >= 2, median day > 0, "days with a trade: at least 20 on H, at least 10 on F (or F-) and on P (S-P and S-M: usable days)"]
  precedence: ["void (K-leak, K-flag-leak, K-units, K-acct, K-cap)", "inconclusive, too few trades (K-trades: round trips; for the quoter entries with any fill); nothing below evaluated", killed (any kill), candidate or passes (the bar), "inconclusive; below the MDE when |mean| < MDE and no kill fired"]
  void_counts_as_killed: true
  set_on_D: ["not admitted on D (<condition i to iv>)", "not run (no admissible cell on D)", same as S25]  # each enters Holm with p = 1 on every block
  measured_rows: the chosen cell of a non-admitted C* or R*, and a non-admitted S-P or S-M, run once on H, F and P as labelled measurements, no placebo, no status
  taken_to_F: [candidate, "inconclusive at precedence step 5, with or without the MDE label, with a positive mean (S25-Z: both claims' means positive)"]  # inconclusive (too few trades), step 2, is not taken to F whatever its sign
  F_split: {F_minus: F's usable days before the alarm's day, F_plus: F's usable days after it, alarm_day: neither}
  F_assessed_on: "F- when there is an alarm in F, F- has at least 20 usable days, R was not declared untestable on D and R is not void; otherwise all of F, labelled, and F is not split"
  F_plus_enters: only R
  P_read_for: slots that passed on F
  P_when_R_supported: "scored only as mean <= 0 (the break persisted) or > 0 (it did not last); no K-trades and no kill applied; void conditions applied (status void); a P series without a day with a trade has mean 0"
  first_significant_on_F: "exploratory: significant on F until P; P is its only confirmatory test; R not tested; never called a candidate"
  R_untestable_or_not_tested_reads_as: not supported
  unreadable:
    judged_on: the slot's instrument
    H: "the slot recorded as not assessed (H unreadable) and not taken to F; F read and reported as measurements; H, F and P spent"
    F: the slot's status after H stands, marked F unreadable; P not read for it
    P: "statuses after F stand, marked P unreadable: a candidate that passed on F is candidate, not confirmed (P unreadable), whatever R showed; one first significant on F is exploratory: significant on F, not confirmed (P unreadable)"
  R_void: "a later detector run does not reproduce an earlier run's alarms (D's as the amendment records them, each block's as its results file does); R read as not supported; found at H's read, F assessed on all of F, labelled; found at F's read, b does not split F (all of F, labelled); found at P's read, F's statuses stand and P is scored with the full bar"
  not_taken_to_F: F reported as one whole block, never split at b
  read_failed: "a first read that fails again at the same stage with the same exception after a resumption at the same commit, or is unfinished after five resumptions, closes with every slot not assessed (<block> read failed), the stage reached and the exception; then as an unreadable block of the same letter (H: nothing taken to F, F read as measurements at the same commit, P not read; F: H's statuses stand, marked F read failed, P not read; P: as P unreadable); no code change"
  defect_after_read: "stated in a dated note, docs/short_horizon_2025_defects.md, naming the mechanism by which it could raise a result; every status it could affect becomes void (defect found after the <block> read), counted as killed for routing and p = 1 in Holm on later blocks; Holm on a block already read recomputed from its committed results file with that p = 1; a status may only fall; later reads run on unchanged code and report it as measurements"
  measurements_never_described_as_working: [any fee tier other than base, any non-default fill rule or exit, F for a slot not taken to F, a measured row, a regime-map segment, any D number]
  outcomes:
    after_H: [candidate, inconclusive, "inconclusive (too few trades)", "inconclusive, below the minimum detectable effect", killed, void, "not run (no admissible cell on D)", "not admitted on D (<condition>)", same as S25, "not assessed (H unreadable)", "not assessed (H read failed)", "void (defect found after the H read)"]
    after_F_and_P: [confirmed, "candidate, not confirmed", confirmed until the break, "candidate; the break did not last", "confirmed on P, first significant on F", "exploratory: significant on F", "exploratory: significant on F, not confirmed", inconclusive, killed on F, killed on P, void, "void (defect found after the <block> read)"]
    marks: [assessed on all of F, F unreadable, P unreadable, F read failed, P read failed, "conditional on a zero-fee venue (S25-Z)"]
  S25-Z: {family: none, alpha: 0.008333, alpha_rule: "alpha / (m + 1)", sided: one, p_value: the larger of its two claims' p-values, conditions_on_both_claims: [t >= 3, Newey-West t >= 2, median day > 0, day counts as the bar], best_status: conditional on a zero-fee venue, reported_beside: [net at base tier, net at cheapest published tier]}

kill_conditions:
  per_slot:
    S25: {execution: taker, series: net_bp_trade, kills: [K1, K-label, K-placebo, K-drift, K-nbhd, K-days, K-fee, K-latency], beside: [regime attribution]}
    S-C: {execution: taker, series: net_bp_trade, kills: [K1, K-label, K-placebo, K-drift, K-nbhd, K-days, K-fee, K-latency], beside: [regime attribution]}
    S-R: {execution: taker, series: net_bp_trade, kills: [K1, K-label, K-placebo, K-drift, K-nbhd, K-days, K-fee, K-latency], beside: [control model IC (on the network), regime attribution]}
    S-P: {execution: signal-entry quoter, series: net_per_100_clip_day, kills: [K1, K-label, K-placebo with stale, K-drift, K-nbhd, K-days, K-fee, K-latency, K-queue], beside: [fill decomposition, fill ratio, markouts by path, passive exit, maker 0 bp, maker -1 bp, regime attribution]}
    S-M: {execution: S1 with the lean, series: net_per_100_clip_day, kills: [K1, K-label, K-placebo with stale, K-drift, K-nbhd, K-days, K-fee, K-latency, K-queue, K-dir], beside: [lean neighbourhood, guard_pull against guard_widen]}
    S25-Z: {execution: signal-entry quoter at 0/0, series: [gross_bp_trade, net at 0/0], kills: [K1, K2, K-label, K-placebo with stale, K-drift, K-nbhd, K-days, K-queue, K-latency], exempt: [K-fee], beside: [net at the base tier on the same trades, fill decomposition]}
  void: [K-leak, K-flag-leak, K-units, K-acct, K-cap]  # K-leak (features or the fold-level test) voids every result; K-flag-leak every slot with a regime window above 0; K-units every slot whose gate or cost input (fee, walk, funding) it reaches, S25-Z included, and S-P and S-M when it reaches their signal's gate
  K-flag-leak: the flag-causality test fails (search.regime_source.flag_causality_test); found before D, fixed by a dated amendment
  status_only: {K-trades: 100, K-trades_counts: "round trips; for the quoter, entries with any fill, not the simulator's fill rows", K-MDE: "below the minimum detectable effect, only when no kill fired"}
  K1: the mean of the daily series on the block <= 0
  K2: net at zero fees (gross plus funding) <= 0  # S25-Z
  K-days_share_positive_max: 0.5  # half or fewer positive days of the daily series kills
  K-nbhd: {statistic: median over the neighbourhood's cells of the daily series' mean, kills_at_or_below: 0, neighbourhood: "search.choice.neighbourhood, regime window included; S25's slots.S25.neighbourhood; S-P its signal's hold x rate x label fee (or hold x k x beta), entered passively; S-M lean 0.5, 1, 2; S25-Z slots.S25-Z.neighbourhood", cell_without_trade_scores: 0, runs_only: the frozen files whose sha256 the amendment records}
  K-latency: {latency_ms: 110, kills: a positive result that is <= 0 there, taker_slots: from walk tables at 110 ms, unit_test: every fill's snapshot stamped at or after decision + 10 ms; label and executor share the walk function}
  K-queue_brackets: [joint pessimistic (pessimistic cancellation and all_ahead), none, all_ahead]
  K-dir: {slot: S-M, code: market_making/verdicts.k_dir, kills: the making part (spread + adverse 5 s over the passive fills) not positive while net is}
  needs_positive_result: [K-queue, K-latency, K-dir]
  on_F: applied to the series the status is assessed on (F- or all of F)
  reported_not_kill: {fill_decomposition: "spread + adverse(5 s) and the rest, for S-P and S25-Z"}
placebo_percentile: 95

placebos:
  sign_flipped: {used_by: [S25, S-C, S-R, S-P, S-M, S25-Z]}
  random_direction: {used_by: [S25, S-C, S-R, S-P, S-M, S25-Z], draws: 200, seeds: [0, 199]}
  one_day_shift: {used_by: [S25, S-C, S-R, S-P, S-M, S25-Z], circular_within_block: true, source: "the previous usable day, stepping over excluded days"}
  stale: {used_by: [S-P, S-M, S25-Z], delay: one hold}
  all_long_all_short: {used_by: [S25, S-C, S-R, S-P, S-M, S25-Z]}  # K-drift
  market_maker: each placebo replaces S-M's signal tape
  taker_slots: placebos and K-latency from walk tables
  positions: each placebo on the true slot's entry decision times with its own one-position state; a decision time at which it is in a position or has an entry resting is skipped and counted; skip counts reported beside K-placebo and K-drift
  control_model: {used_by: [S-R on the network], reported: IC against its own label and against the realised move}
  other_break_dates: {used_by: [R], split_days: "every admissible split day of F (at least 20 usable days before, at least 10 after), enumerated", reference_set: split days at which the slot also passes on F's days before them, min_reference_days: 20,
                       evaluated_at_each_d: "the whole bar, kills and Holm with m = 5 included, on F's usable days before d as on F-; other slots taken to F evaluated there the same way, p = 1 where killed, void or inconclusive under K-trades there, or not taken to F; K-trades counts trades before d",
                       computed: "every series the bar reads computed once per day over all of F in F's read session (one-day shift circular within all of F) and sliced at each d; nothing re-run"}

hypotheses:
  S25: {block: H, claim: net_bp_trade > 0, kills: kill_conditions.per_slot.S25, prediction: killed by K1}
  S-C: {block: H, claim: net_bp_trade > 0 at C*, kills: kill_conditions.per_slot.S-C, prediction: not admitted on D (i)}
  S-R: {block: H, claim: net_bp_trade > 0 at R*, kills: kill_conditions.per_slot.S-R, prediction: not admitted on D (i)}
  S-P: {block: H, claim: net_per_100_clip_day > 0, kills: kill_conditions.per_slot.S-P, prediction: "not admitted on D (i); if it reaches H, killed by K1"}
  S-M: {block: H, claim: net_per_100_clip_day > 0 with a positive making part, kills: kill_conditions.per_slot.S-M, prediction: "not admitted on D (i); if it reaches H, killed by K1 or K-dir"}
  S25-Z: {block: H, outside_family: true, conditional: zero fee on both sides, claims: [gross_bp_trade > 0, net at zero fees > 0], kills: kill_conditions.per_slot.S25-Z, asks: whether the signal pays before fees, prediction: killed by K1}
  R:
    tested_for: every slot, S25 and S25-Z included, that is a candidate on H, whether or not it passes on F-
    not_tested_for: any other slot, including one first significant on F
    statistic: Delta(d) = mean of the daily series on F's usable days before d minus its mean on those after d
    claims: [passes on F-, mean daily series on F_plus <= 0, Delta(b) above the 95th percentile of Delta(d) over the reference set]
    supported: all three claims hold
    S25-Z_series: every claim and the P mean evaluated on both of S25-Z's claims' series (gross, net at 0/0); supported only if every claim holds on both; on P the break persisted only if both means are <= 0
    guarded_slots: a slot with a regime window above 0 enters R with its own guarded series  # the regime axis does not replace R
    when_F_minus_fails: Delta(b) reported with its percentile among all admissible days, as a measurement
    untestable: [no alarm in F, fewer than 20 usable days before b or fewer than 10 after, alarm rate on D above one per 14 days, fewer than 20 days in the reference set]
    untestable_reads_as: not supported
    void: statuses.R_void

measurements:
  A0: {block: O, comparison_figure: none, prediction: none}
  FILL:
    stream: A0's passive orders on O; also Z's on H
    rules:
      on_touch: fills in full at the first print at or through its price from the hitting side, ignoring the queue  # optimistic bound
      trade_through: fills only on prints strictly through its price, up to their size  # R7 alone
      queue: R5, R6 and R7  # the simulator's default
    fill_ratio: share of posted orders with any fill (backtest/maker.py fill_rate); filled over posted volume reported beside
    prediction: {on_touch_fill_ratio_min: 0.75, queue_fill_ratio_max: 0.50}
  fee_break_even: {taker: gross_bp_turnover, passive: maker fee at zero net with the taker exit at 5.5 and at 1.5 bp}
  H_before_2025_08_01: {slots: every slot, days: 2025-07-08..2025-07-31, label: sensitivity, status: none}
  gap_days_included: every verdict's mean, t and median day with the gap-excluded days put back
  result_O: null  # A0 and FILL tables; frozen by the D amendment

detector:
  input: hourly log returns of detector_bars, divided by D's root mean square at the same UTC hour
  stream: one continuous stream from 2024-12-01, E's hourly bars included (fetched and read when H opens)
  missing_hour: close carried forward, zero return, counted and reported; no reset
  bars_after_2025_06_30: Binance daily archives only, one day at a time, inside the opened access of their block
  monthly_klines: none for a month after 2025-06 fetched or cached before P's read; the loader refuses a monthly kline file reaching past the highest opened block
  library: {name: structural-break, tag: v0.1.0, commit: 0636813fdd4ccc9f25490d97f62d6fccecb01881}
  monitor: {code: validation/structural_breaks.py, unit: hours (one hourly return a step), history_len: 365, online_len: 90, min_history: 121, minimum_gap: 0, statistics: [scale, dependence], thresholds: {scale: 9.09, dependence: 7.93}}
  run: one detect_breaks call over the stream from 2024-12-01 to the last hour of the highest opened block, windows anchored at the stream's start
  reproduce_earlier_alarms: required; if a later run does not, R is void and read as not supported (statuses.R_void)
  mean_channel: {column: odds_mean, threshold: 8.93, reported: true, re_anchors: false, defines_b: false}
  b: first alarm effective in F, at the close of the hour whose return produced it
  max_alarm_rate_D_per_14_days: 1  # above it, R is declared untestable before H and b does not split F
  alarm_rate_D_optimistic: true  # hour profile fitted on D itself; thresholds calibrated on Gaussian null paths; reported, not corrected
  hour_profile: null  # 24 values fitted on D; frozen by the D amendment
  alarm_rate_D: null  # alarms over 2025-01-01..06-30; frozen by the D amendment
  alarms_D: null  # timestamp and channel of every alarm over 2025-01-01..06-30, for the reproduction check; frozen by the D amendment
  alarms_recorded: each block's run's alarms, with timestamp and channel, in that block's results file
  r_untestable_declared: null  # true or false; frozen by the D amendment
  reported_beside:
    changepoint: {code: validation/changepoint.py detect, grid: "data/grid.to_grid, 1 s, label right", window: 2000, threshold: 20, reference: 40, minimum_gap: 20000, runs: [continuous over D, restarted on 2025-07-08, continuous over H, restarted on 2025-08-21, continuous from F through P], label_within_one_day_of: 2025-08-21}
    earlier_daily_run: experiments/results/structural_breaks_BTCUSDT_breaks.csv  # public before this registration

fetch:
  via: this study's fetch (new code, on data/ensure.py's pattern)  # only missing days; archives not kept after the replay
  replay: {code: data/bybit.reconstruct, unchanged: true, workers_max: 4, workers_rule: "fewer if 4 x the peak RSS of one replayed day exceeds 24 GB", peak_rss_measured: before stage 1 on a 2024 day already replayed by the repository, recorded_in: the amendment}
  failures: {every_day_present_in_head_check: fetched, other_than_http_404: partial file deleted and retried with backoff until on disk or excluded by a terminal rule, stage_complete: only when every such day is on disk or excluded by a terminal rule,
             unreadable_archive: "downloaded completely at least twice with the same sha256 and still not decompressing, or a replay that raises on a complete archive; likewise prints", unfetchable_day: download still failing after 10 attempts over at least 48 hours,
             terminal_rules_apply_to: [W, D, H, F, P], terminal_exclusions: counted per block by reason and toward the unreadable rule,
             missing_plane: HTTP 404 only, funding_and_bars: same rule; an empty funding history is a missing plane}
  disk:
    free_gb_at_registration: 121
    feature_store: {dtype: float32, format: one zstd parquet per day, holds: model inputs only, budget_mb_per_day: 250}  # labels, gate walk cost and fills from the book's float64 prices
    check_before_each_stage: free disk exceeds the stage's budget (archives in flight, books, prints, features) by 10 GB, or the stage refuses
    delete_W_and_D_features: after H's results are committed, before stage 3
  ledger_opens_first: true  # the open is recorded, then the block's fetch runs under that access
  ledger_records: sha256 and UTC download time of every fetched file
  open_refuses_if_on_disk: any book, print, funding or hourly-bar file of the block; for H also any hourly bar of E
  stages:
    - {stage: 1, when: after this registration and its code are merged, what: [W, D, funding for W and D only, hourly bars 2024-12-01..2025-06-30, ob200 reader-test days 2026-01-05..07], archives_gb: {book: 76.0, prints: 15.3}}
    - {stage: 2, when: inside H's opened access after the amendment is committed, what: [H, H's funding, E's and H's hourly bars from daily archives], archives_gb: {book: 11.4, prints: 2.1}}
    - {stage: 3, when: inside F's opened access after H's results are committed, what: [F, F's funding, F's hourly bars from daily archives], archives_gb: {book: 15.8, prints: 5.9}}
    - {stage: 4, when: inside P's opened access after F's results are committed and only if the condition holds, what: [P, P's funding, P's hourly bars from daily archives], archives_gb: {book: 9.9, prints: 3.5}}
  E_book_prints_funding_fetched: false

compute:
  machine: {cores: 10, memory_gb: 32, workers: "a runtime argument, 8 by default, recorded in the ledger; outputs identical at 1 and N workers (tested); a resumption may use fewer", replay_workers_max: 4}
  download_gb: {stage_1: 91.3, stage_2: 13.5, stage_3: 21.7, stage_4: 13.4}  # archives, from the HEAD sums
  launch: nohup caffeinate, log in logs/
  R_reference_set: about 58 split days per candidate, slices of per-day values computed on F; minutes, inside F's read session
  record: null  # measured times and peak memory; frozen by the D amendment

access:
  development: [W and D book, prints and funding, hourly bars up to 2025-06-30, the ob200 reader-test days]
  development_refuses: every 2025 day after 2025-06-30 in every plane, including data/bars/BTCUSDT/klines-1d
  ledger: experiments/results/short_horizon_2025_ledger.json
  ledger_guards: [E hourly bars, H, F, P]
  block_constants: this study's own; round one's block_of not used
  entry_point: experiments/short_horizon_2025.py  # committed with the amendment; one read session computes everything for a block
  H: [amendment records the YAML sha256, the file has it and is committed, tree clean, every frozen weight file's sha256 and the fitted-values file's sha256 equal the amendment's, no H file and no E hourly bar on disk]
  every_open_and_every_process: ["git status --porcelain --untracked-files=normal lists nothing but the ledger file", "git diff --name-only <session's commit>..HEAD lists nothing but the ledger file", the environment fingerprint equals H's open entry's, the block's open entry is in HEAD's history]
  environment_fingerprint: sha256 of the installed distributions with their versions, structural-break at its locked commit included; recorded in H's open entry
  open_entry: committed and pushed before the block's fetch begins; records block, session commit, config sha256, environment fingerprint and UTC time; the fetch's per-file records committed when the fetch ends, before anything is computed
  read_session: {bound_to: [block, commit, config sha256, environment fingerprint], resumptions_at_that_commit: first read, outputs_inspected: only after the results file is written, resumption_at_another_commit: second read, failure: statuses.read_failed}
  results_files: {H: experiments/results/short_horizon_2025_H.json, F: experiments/results/short_horizon_2025_F.json, P: experiments/results/short_horizon_2025_P.json}
  session_closes: the results file, statuses and every kill computed by the entry point, is written and its sha256 entered in the block's ledger entry
  F: ["H's results file committed unchanged (sha256 equals the ledger's)", "git diff --name-only <H read's commit>..HEAD lists only README.md and paths under experiments/results/ and under docs/ outside docs/preregistration/", frozen weights' and the fitted-values file's sha256 match, every_open_and_every_process holds, no F file on disk]
  P: [the same conditions against F's read, for the hypotheses that qualify]
  second_read: raises unless forced; stamped second read; cannot change a status
  earlier_accesses_used: false  # neither round one's nor round two's; pipeline/execution's market-maker path (round one's access_for) not used
  spent_blocks: "H, F and P are spent for every configuration of this catalogue on the three instruments; a successor, a corrected re-run included, uses blocks after 2025-12-31 and never the reader-test days"

amendment:
  planned: 1
  before: the read of H
  records: [excluded days and max_sequence_gaps by its rule, N, reader-test days' message counts intervals and gaps, selected features, chosen cells with neighbourhoods and peaks, M1's signal, sigma_D and MDEs, A0 and FILL on O, detector alarm rate on D with every alarm's timestamp and channel and any untestable declaration, the detector's 24-value hour-of-day profile fitted on D, the fitted-values file's sha256, every frozen weight file's sha256, every threshold, every checkpoint epoch, the entry point, "the compute record, with the replay's peak memory and worker count and the feature store's size", fits that lacked a class with the side, the frozen YAML sha256]
  hash_line: "Frozen configuration sha256: `<hash>`"
  date: null  # frozen by the D amendment
